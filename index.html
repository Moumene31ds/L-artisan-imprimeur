                                <Icon name={lang === 'ar' ? "arrow-left" : "arrow-right"} className="group-hover:-translate-x-1 transition-transform" size={20}/>
                            </button>
                        </div>

                        <div className="flex-1 relative w-full h-[400px] lg:h-[500px] hidden md:flex items-center justify-center animate-fadeIn" style={{animationDelay: '0.3s'}}>
                            <div className="absolute z-20 w-64 h-40 ios-glass-dark rounded-3xl p-5 shadow-2xl border border-white/20 transform -rotate-6 hover:rotate-0 transition-all duration-500 animate-bounce-slow flex flex-col justify-between overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-blue-500/20 to-transparent rounded-bl-full pointer-events-none"></div>
                                <div className="flex justify-between items-start">
                                    <div className="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center backdrop-blur-md">
                                        <Icon name="credit-card" size={20} className="text-white" />
                                    </div>
                                    <span className="text-white/50 font-mono text-xs">L'Artisan</span>
                                </div>
                                <div>
                                    <div className="w-3/4 h-3 bg-white/20 rounded-full mb-2"></div>
                                    <div className="w-1/2 h-2 bg-white/10 rounded-full"></div>
                                </div>
                            </div>

                            <div className="absolute z-10 right-4 lg:right-12 top-10 w-48 h-64 bg-white/40 backdrop-blur-xl rounded-3xl p-4 shadow-xl border border-white/60 transform rotate-12 hover:rotate-6 transition-all duration-500 animate-bounce-slow" style={{animationDelay: '1s'}}>
                                <div className="w-full h-24 bg-gradient-to-br from-purple-400/30 to-blue-400/30 rounded-2xl mb-3"></div>
                                <div className="w-full h-2 bg-slate-300/50 rounded-full mb-2"></div>
                                <div className="w-5/6 h-2 bg-slate-300/50 rounded-full mb-2"></div>
                                <div className="w-4/6 h-2 bg-slate-300/50 rounded-full"></div>
                            </div>

                            <div className="absolute z-30 bottom-16 left-10 lg:left-20 bg-white/90 backdrop-blur-2xl rounded-2xl p-3 shadow-[0_10px_30px_rgba(0,0,0,0.1)] border border-white/80 flex items-center gap-3 transform -rotate-3 hover:scale-105 transition-all">
                                <div className="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center text-green-600">
                                    <Icon name="check-circle" size={24} />
                                </div>
                                <div>
                                    <p className="font-bold text-sm text-slate-800 leading-tight">{lang === 'ar' ? 'طلبك جاهز!' : 'Commande prête!'}</p>
                                    <p className="text-[10px] text-slate-500">{lang === 'ar' ? 'تمت الطباعة بجودة عالية' : 'Imprimé en haute qualité'}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="w-full bg-white/30 backdrop-blur-xl border-t border-white/50 py-6 z-10 mt-auto">
                        <div className="container mx-auto max-w-6xl px-4 flex flex-wrap justify-center md:justify-between gap-6">
                            {[
                                { icon: 'star', title: lang === 'ar' ? 'جودة استثنائية' : 'Qualité Premium', desc: lang === 'ar' ? 'ورق فاخر وألوان زاهية' : 'Papier de luxe & couleurs vives', color: 'text-blue-600', bg: 'bg-blue-100/50' },
                                { icon: 'clock', title: lang === 'ar' ? 'سرعة في الإنجاز' : 'Service Rapide', desc: lang === 'ar' ? 'التزام تام بالمواعيد' : 'Respect total des délais', color: 'text-purple-600', bg: 'bg-purple-100/50' },
                                { icon: 'truck', title: lang === 'ar' ? 'توصيل لكل الولايات' : 'Livraison 58 Wilayas', desc: lang === 'ar' ? 'نصلك أينما كنت' : 'Partout en Algérie', color: 'text-green-600', bg: 'bg-green-100/50' }
                            ].map((f, i) => (
                                <div key={i} className="flex items-center gap-3 w-full md:w-auto p-2">
                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center backdrop-blur-sm border border-white/60 shadow-sm ${f.bg} ${f.color}`}>
                                        <Icon name={f.icon} size={24} />
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800 text-sm">{f.title}</h4>
                                        <p className="text-xs text-slate-500">{f.desc}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [showLanding, setShowLanding] = useState(true);

            const getInitialView = () => window.location.hash.substring(1).split('/')[0] || 'home';
            const [lang, setLang] = useState(() => localStorage.getItem('app_lang') || 'ar');
            const [view, setView] = useState(getInitialView());
            const [cart, setCart] = useState(() => { 
                try { 
                    const storedCart = JSON.parse(localStorage.getItem('artisanCart')) || [];
                    return storedCart.map(item => ({ 
                        ...item, 
                        price: item.price || item.basePrice || 0,
                        totalPrice: item.totalPrice || (item.price * item.qty) || 0
                    }));
                } catch { return []; } 
            });
            const [favorites, setFavorites] = useState(() => {
                try { return JSON.parse(localStorage.getItem('artisanFavs')) || []; } catch { return []; }
            });
            
            const [appliedPromo, setAppliedPromo] = useState(null); 
            const [promoCodeInput, setPromoCodeInput] = useState(''); 
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true); 
            const [db, setDb] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [myOrders, setMyOrders] = useState([]);
            const [toast, setToast] = useState(null);
            const [activeChat, setActiveChat] = useState(null);
            const [productModal, setProductModal] = useState(null);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showAIGenerator, setShowAIGenerator] = useState(false);
            const [selectedDesignProduct, setSelectedDesignProduct] = useState(null);
            const [uiConfig, setUiConfig] = useState({});
            const [bypassMaintenance, setBypassMaintenance] = useState(false);
            
            const [searchTerm, setSearchTerm] = useState("");
            const [isListening, setIsListening] = useState(false);
            const [activeCategory, setActiveCategory] = useState('all');
            
            const [selectedWilayaZone, setSelectedWilayaZone] = useState(() => {
                const savedW = localStorage.getItem('saved_wilaya');
                if (savedW) {
                    const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === savedW);
                    return w ? w.zone : null;
                }
                return null;
            });

            const [expandedOrderId, setExpandedOrderId] = useState(null);

            const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'l-artisan-imprimeur';
            const t = TRANSLATIONS[lang];
            
            // متغير للتحقق هل المستخدم الحالي ضمن قائمة المدراء/الشركاء
            const isAdmin = user && ADMIN_EMAILS.includes(user.email);
            
            const startVoiceSearch = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return showToast(lang === 'ar' ? "متصفحك لا يدعم البحث الصوتي" : "Recherche vocale non supportée", "error");
                
                try {
                    const recognition = new SpeechRecognition();
                    recognition.lang = lang === 'ar' ? 'ar-DZ' : 'fr-FR';
                    
                    recognition.onstart = () => setIsListening(true);
                    recognition.onresult = (e) => { 
                        setSearchTerm(e.results[0][0].transcript); 
                        setIsListening(false); 
                    };
                    recognition.onerror = () => { setIsListening(false); };
                    recognition.onend = () => setIsListening(false);
                    
                    recognition.start();
                } catch (err) {
                    setIsListening(false);
                    showToast(lang === 'ar' ? "يرجى السماح بالوصول للميكروفون" : "Veuillez autoriser le microphone", "error");
                }
            };

            const calculateTotal = useCallback((currentCart, promo, zone) => {
                const subtotal = currentCart.reduce((s,i) => s + (i.price*i.qty), 0);
                let discount = 0;
                if (promo) {
                    if (promo.discountType === 'percent') discount = subtotal * (promo.discountValue / 100);
                    else if (promo.discountType === 'fixed') discount = promo.discountValue;
                    discount = Math.min(discount, subtotal);
                }
                const delivery = zone ? (DELIVERY_FEES[zone] || 0) : 0;
                const finalTotal = subtotal - discount + delivery;
                return { subtotal, discount, delivery, finalTotal: Math.max(0, finalTotal) };
            }, []);

            const applyPromoCode = async (code) => {
                if (!db || !appId) return showToast(t.conn, "error");
                if (!code) return showToast(t.promoEnter, 'info');
                
                try {
                    const q = window.firebase.query(
                        window.firebase.collection(db, `artifacts/${appId}/public/data/promoCodes`),
                        window.firebase.where('code', '==', code.trim().toUpperCase()),
                        window.firebase.where('active', '==', true),
                        window.firebase.limit(1)
                    );
                    const snapshot = await window.firebase.getDocs(q);
                    
                    if (snapshot.empty) { 
                        setAppliedPromo(null); 
                        showToast(t.promoInvalid, 'error'); 
                        return; 
                    }
                    
                    const promo = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
                    
                    if (promo.expiryDate && new Date(promo.expiryDate) < new Date()) {
                        showToast(t.expiredPromo, 'error');
                        setAppliedPromo(null);
                        return;
                    }
                    
                    if (promo.maxUses && promo.currentUses >= promo.maxUses) {
                        showToast(t.limitReachedPromo, 'error');
                        setAppliedPromo(null);
                        return;
                    }

                    const currentTotal = cart.reduce((s,i) => s + (i.price*i.qty), 0);
                    if (promo.minAmount && currentTotal < promo.minAmount) {
                         showToast(`${t.promoMinAmount} ${formatPrice(promo.minAmount)} ${t.currency}`, 'error');
                         setAppliedPromo(null);
                         return;
                    }
                    
                    setAppliedPromo(promo);
                    showToast(t.promoApplied, 'success');
                } catch (e) { showToast(t.err, "error"); }
            };
            
            const handleGetOffer = async (offer) => {
                const cartItem = {
                    id: `offer-${offer.id}`,
                    name: { fr: offer.title, ar: offer.title }, 
                    basePrice: parseFloat(offer.price) || 0,
                    price: parseFloat(offer.price) || 0,
                    image: offer.image,
                    qty: 1,
                    selectedVariants: [{ id: 'type', label: 'Type', value: 'Offre Spéciale' }]
                };
                
                setCart(prev => [...prev, { ...cartItem, cartId: `offer-${Date.now()}` }]);
                if (offer.promoCode) await applyPromoCode(offer.promoCode);
                
                navigate('cart');
                showToast(t.addToCart, 'success');
            };

            const toggleFavorite = (product) => {
                let newFavs;
                if (favorites.some(f => f.id === product.id)) {
                    newFavs = favorites.filter(f => f.id !== product.id);
                    showToast(t.removeFromFav);
                } else {
                    newFavs = [...favorites, product];
                    showToast(t.addToFav, 'success');
                }
                setFavorites(newFavs);
                localStorage.setItem('artisanFavs', JSON.stringify(newFavs));
            };

            const navigate = (newView, replace = false) => {
                if (newView === view && !activeChat && !productModal && !showQrModal && !showAIGenerator) return;
                setView(newView);
                setAppliedPromo(null); 
                setActiveChat(null); 
                setProductModal(null);
                setShowQrModal(false);
                setShowAIGenerator(false);
                const hash = newView;
                if (replace) window.history.replaceState({ view: newView, chat: false }, '', `#${hash}`);
                else window.history.pushState({ view: newView, chat: false }, '', `#${hash}`);
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const openChat = (chatDetails) => {
                setActiveChat(chatDetails);
                window.history.pushState({ view: view, chat: true, userId: chatDetails?.userId, userName: chatDetails?.userName }, '', `#chat`);
            };

            const closeChat = () => window.history.back();
            const openProductModal = (product) => setProductModal(product);
            const closeProductModal = () => setProductModal(null);

            useEffect(() => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = lang; localStorage.setItem('app_lang', lang); }, [lang]);
            const toggleLang = () => setLang(prev => prev === 'ar' ? 'fr' : 'ar');
            
            useEffect(() => { 
                localStorage.setItem('artisanCart', JSON.stringify(cart.map(i => ({
                    id: i.id, 
                    name: i.name, 
                    basePrice: i.basePrice, 
                    price: i.price,
                    qty: i.qty, 
                    image: i.image, 
                    selectedVariants: i.selectedVariants || [] 
                }))));
            }, [cart]);

            useEffect(() => {
                const handlePopState = (event) => {
                    const state = event.state;
                    if (state && state.view) {
                        setView(state.view);
                        setActiveChat(state.chat ? { userId: state.userId, userName: state.userName } : null);
                    } else {
                        setView(getInitialView());
                        setActiveChat(null);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                if (window.history.state === null) {
                    const initialViewName = getInitialView();
                    window.history.replaceState({ view: initialViewName, chat: false }, '', `#${initialViewName}`);
                }
                return () => window.removeEventListener('popstate', handlePopState);
            }, [view]);

            useEffect(() => {
                const init = async () => {
                    if(!window.__firebase_config) return;
                    
                    const checkFirebase = setInterval(async () => {
                        if (window.firebase && window.isFirebaseReady) {
                            clearInterval(checkFirebase); 
                            try {
                                const app = window.firebase.initializeApp(JSON.parse(window.__firebase_config));
                                const auth = window.firebase.getAuth(app);
                                const firestore = window.firebase.getFirestore(app);
                                setDb(firestore);
                                
                                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                                    await window.firebase.signInWithCustomToken(auth, window.__initial_auth_token);
                                }
                                
                                window.firebase.onAuthStateChanged(auth, (u) => { 
                                    setUser(u); 
                                    setAuthLoading(false); 
                                });
                            } catch (e) { 
                                console.error("Firebase Init Error", e); 
                                setAuthLoading(false); 
                            }
                        }
                    }, 100); 
                };
                init();
            }, []);

            useEffect(() => {
                if (!user || !db || !appId) return;
                
                if ("Notification" in window && Notification.permission !== "granted") {
                    Notification.requestPermission();
                }

                const notifRef = window.firebase.collection(db, `artifacts/${appId}/users/${user.uid}/notifications`);
                const unsubNotif = window.firebase.onSnapshot(window.firebase.query(notifRef, window.firebase.orderBy('date', 'desc')), (snap) => {
                    const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    setNotifications(list);
                    const fresh = list.find(n => !n.read && n.date && n.date.toMillis && (Date.now() - n.date.toMillis()) < 5000);
                    if (fresh) {
                        const msgText = typeof fresh.message === 'object' ? (fresh.message[lang] || fresh.message.fr) : fresh.message;
                        showToast(msgText, 'success');
                        
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(t.appTitle, { body: msgText });
                        }
                    }
                });
                const ordersRef = window.firebase.collection(db, `artifacts/${appId}/public/data/orders`);
                const unsubOrders = window.firebase.onSnapshot(window.firebase.query(ordersRef, window.firebase.where('customerUserId', '==', user.uid)), (snap) => {
                    const fetchedOrders = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    fetchedOrders.sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                        return timeB - timeA;
                    });
                    setMyOrders(fetchedOrders);
                });
                const unsubConfig = window.firebase.onSnapshot(window.firebase.doc(db, `artifacts/${appId}/config/ui`), (d) => { if(d.exists()) setUiConfig(d.data()); });
                return () => { unsubNotif(); unsubOrders(); unsubConfig(); };
            }, [user, db, lang, appId, t]);

            const showToast = (msg, type='info') => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };
            
            const addToCart = (p) => { 
                setCart(prev => {
                    const cartItemId = `${p.id}-${Date.now()}`; 
                    const newItem = { ...p, cartId: cartItemId, price: p.price, qty: p.qty, selectedVariants: p.selectedVariants || [] };
                    return [...prev, newItem];
                }); 
                showToast(t.addToCart); 
            };

            const updateQty = (cartId, delta) => {
                setCart(prev => prev.map(item => {
                    if(item.cartId === cartId) { const newQty = Math.max(0, item.qty + delta); return {...item, qty: newQty}; }
                    return item;
                }).filter(item => item.qty > 0));
            };
            
            const handleReorder = (order) => {
                const reorderedItems = order.items.map(item => ({ ...item, cartId: `${item.id}-${Date.now()}-${Math.random()}`, name: item.name, price: item.price, qty: item.qty, image: item.image, selectedVariants: item.selectedVariants || [] }));
                setCart(prev => [...prev, ...reorderedItems]); showToast(t.addToCart); navigate('cart');
            };

            const submitOrder = async (e) => {
                e.preventDefault(); 
                if (!user || !db) return showToast(t.conn, "error");

                if (myOrders.length > 0) {
                    const lastOrderTime = myOrders[0].createdAt?.toMillis ? myOrders[0].createdAt.toMillis() : 0;
                    if (Date.now() - lastOrderTime < 120000) {
                        return showToast(lang === 'ar' ? 'يرجى الانتظار قليلاً قبل إرسال طلب جديد' : 'Veuillez patienter avant de passer une autre commande', 'error');
                    }
                }
                
                const formData = new FormData(e.target);
                const phone = formData.get('phone') || '';
                const name = formData.get('name') || '';
                
                const phoneRegex = /^(0)(5|6|7)[0-9]{8}$/;
                if (!phoneRegex.test(phone)) {
                    return showToast(t.phoneError, 'error');
                }
                
                const selectedWilayaString = formData.get('wilaya');
                if(!selectedWilayaString) return showToast(t.err, 'error');

                let currentZone = selectedWilayaZone;
                if (selectedWilayaString) {
                    const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === selectedWilayaString);
                    if (w) currentZone = w.zone;
                }

                const { subtotal, finalTotal, discount, delivery } = calculateTotal(cart, appliedPromo, currentZone); 
                const customOrderId = Math.random().toString(36).substring(2, 11).toUpperCase();
                
                try {
                    const orderData = {
                        id: customOrderId,
                        customerUserId: user.uid,
                        customerName: name,
                        phone: phone,
                        wilaya: selectedWilayaString || '',
                        orderDetails: formData.get('orderDetails') || '',
                        items: cart.map(i => ({ 
                            id: i.id || '', 
                            name: i.name || '', 
                            basePrice: i.basePrice || 0, 
                            price: i.price || 0, 
                            qty: i.qty || 1, 
                            image: i.image || '', 
                            selectedVariants: i.selectedVariants || [] 
                        })),
                        subtotal: subtotal || 0,
                        total: finalTotal || 0,
                        discount: discount || 0,
                        deliveryFee: delivery || 0,
                        promoCode: appliedPromo ? { 
                            code: appliedPromo.code || '', 
                            value: discount || 0, 
                            type: appliedPromo.discountType || '',
                            partnerName: appliedPromo.partnerName || null,
                            commissionRate: appliedPromo.commissionRate || 0
                        } : null,
                        status: 'En attente',
                        createdAt: window.firebase.Timestamp.now()
                    };

                    localStorage.setItem('saved_phone', phone);
                    localStorage.setItem('saved_wilaya', selectedWilayaString || '');

                    const documentPath = `artifacts/${appId}/public/data/orders/${customOrderId}`;
                    await window.firebase.setDoc(window.firebase.doc(db, documentPath), orderData);
                    
                    if (appliedPromo && appliedPromo.id && window.firebase.increment) {
                        const promoRef = window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes/${appliedPromo.id}`);
                        await window.firebase.updateDoc(promoRef, { currentUses: window.firebase.increment(1) });
                    }
                    
                    let msg = { fr: "Commande reçue!", ar: "تم استلام الطلب!" };
                    await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/users/${user.uid}/notifications`), { 
                        message: msg, 
                        date: window.firebase.Timestamp.now(), 
                        read: false, 
                        type: 'info' 
                    });
                    
                    setCart([]); 
                    setAppliedPromo(null); 
                    setPromoCodeInput(''); 
                    navigate('orders'); 
                    showToast(t.orderSent, "success");

                } catch (e) { 
                    console.error("Order Submit Error:", e); 
                    showToast(t.err, "error"); 
                }
            };

            const cancelOrder = async (orderId) => {
                if (!confirm(lang === 'ar' ? "هل أنت متأكد من إلغاء هذا الطلب؟" : "Voulez-vous vraiment annuler cette commande ?")) return;
                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/orders/${orderId}`), { status: 'Annulé' });
                    showToast(lang === 'ar' ? "تم إلغاء الطلب بنجاح" : "Commande annulée avec succès", "success");
                } catch (error) {
                    console.error("Cancel Error:", error);
                    showToast(t.err, "error");
                }
            };

            const updateOrderStatus = async (orderId, newStatus, customerId) => {
                if (!db || !appId || !isAdmin) return;
                try {
                    const docPath = `artifacts/${appId}/public/data/orders/${orderId}`;
                    await window.firebase.updateDoc(window.firebase.doc(db, docPath), { status: newStatus });
                    
                    showToast(t.statusUpdate);
                    
                    if (customerId) {
                        const statusLabel = STATUS_OPTIONS.find(s => s.key === newStatus)?.label;
                        let msg = { fr: `Statut: ${statusLabel.fr}`, ar: `الحالة: ${statusLabel.ar}` }; 
                        if (newStatus === 'Prêt') msg = { fr: "Commande prête!", ar: "طلبك جاهز!" };
                        
                        await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/users/${customerId}/notifications`), { 
                            message: msg, 
                            date: window.firebase.Timestamp.now(), 
                            read: false, 
                            type: 'status', 
                            orderId 
                        });
                    }
                } catch (e) { 
                    console.error("Error updating status:", e);
                    showToast("Error updating status", "error"); 
                }
            };
            const markRead = async (id) => { if (db && appId) await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/users/${user.uid}/notifications`, id), {read: true}); };
            
            if (authLoading) return <div className="h-screen flex items-center justify-center bg-transparent"><div className="loader"></div></div>;

            const isMaintenanceActive = uiConfig?.maintenanceMode === true;
            if (isMaintenanceActive && !bypassMaintenance && (!user || !ADMIN_EMAILS.includes(user.email))) {
                return <MaintenanceScreen t={t} lang={lang} onAdminClick={() => setBypassMaintenance(true)} uiConfig={uiConfig} />;
            }

                                                    <div className="space-y-2.5 text-sm mb-3 text-slate-600 font-medium">
                                                        <div className="flex justify-between"><span>{t.subtotal}</span><span>{formatPrice(subtotal)} {t.currency}</span></div>
                                                        {delivery > 0 && <div className="flex justify-between text-slate-800 font-bold bg-white/40 p-1.5 rounded-lg -mx-1.5 px-1.5 border border-white/50"><span>{t.deliveryFee}</span><span>+ {formatPrice(delivery)} {t.currency}</span></div>}
                                                        {discount > 0 && <div className="flex justify-between text-green-700 font-bold bg-green-50/80 p-1.5 rounded-lg -mx-1.5 px-1.5 border border-green-100"><span>{t.discount}</span><span>- {formatPrice(discount)} {t.currency}</span></div>}
                                                    </div>
                                                    <div className="flex justify-between items-center font-bold border-t border-white/50 pt-4 mb-6">
                                                        <span className="text-lg text-slate-800">{t.total}</span>
                                                        <span className="text-2xl text-blue-700 font-black bg-white/60 px-4 py-1.5 rounded-xl border border-blue-100 shadow-sm">{formatPrice(finalTotal)} <span className="text-base">{t.currency}</span></span>
                                                    </div>
                                                    
                                                    <form onSubmit={submitOrder} className="space-y-3 relative z-10">
                                                        <input aria-label="Name" required name="name" defaultValue={user.displayName || ''} placeholder={t.namePh} className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition shadow-inner font-bold text-slate-800"/>
                                                        <input aria-label="Phone" required name="phone" type="tel" pattern="^(0)(5|6|7)[0-9]{8}$" title={t.phoneError} defaultValue={savedPhone} placeholder={t.phonePh} className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition dir-ltr shadow-inner font-bold text-slate-800"/>
                                                        <div className="relative">
                                                            <select aria-label="Wilaya" name="wilaya" required defaultValue={savedWilaya} onChange={(e) => {
                                                                const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === e.target.value);
                                                                setSelectedWilayaZone(w ? w.zone : null);
                                                            }} className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition appearance-none text-slate-800 shadow-inner font-bold cursor-pointer">
                                                                <option value="">{t.selectWilaya}</option>
                                                                {WILAYAS.map((w) => <option key={w.id} value={`${w.id} - ${w.name}`} className="text-black">{w.id} - {w.name}</option>)}
                                                            </select>
                                                            <Icon name="chevron-down" className="absolute left-4 top-4 text-slate-400 pointer-events-none" size={20}/>
                                                        </div>
                                                        <textarea aria-label="Order Details" required name="orderDetails" placeholder={t.orderDetails} rows="3" className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition shadow-inner resize-none font-medium"></textarea>
                                                        <button type="submit" className="w-full bg-green-600/90 backdrop-blur hover:bg-green-500 text-white py-4 rounded-2xl font-black shadow-lg shadow-green-600/30 transition flex justify-center items-center gap-2 active:scale-95 text-base mt-2 border border-green-500" disabled={cart.length === 0}><Icon name="check-circle" size={20}/> {t.confirm}</button>
                                                    </form>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}
                            </div>
                        )}
                        {view === 'orders' && (
                            <div className="animate-fadeIn space-y-4 max-w-md mx-auto pb-10">
                                <h2 className="font-bold text-2xl mb-4 text-slate-800">{t.myOrders}</h2>
                                {myOrders.length === 0 ? <div className="text-center py-20 text-slate-400 ios-glass rounded-3xl border border-white/60"><Icon name="list" size={48} className="mx-auto mb-4 opacity-40"/>{t.noOrders}</div> : myOrders.map(o => {
                                    const statusObj = STATUS_OPTIONS.find(s => s.key === o.status) || STATUS_OPTIONS[0];
                                    const isExpanded = expandedOrderId === o.id;
                                    
                                    const orderDate = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
                                    const estDelivery = new Date(orderDate);
                                    estDelivery.setDate(estDelivery.getDate() + 3);
                                    
                                    return (
                                        <div key={o.id} className="ios-glass rounded-3xl shadow-sm overflow-hidden hover:shadow-md transition border border-white/60">
                                            <div className="p-4 border-b border-white/40 flex justify-between items-center bg-white/30 backdrop-blur-sm">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-lg text-slate-800 bg-white/50 px-2 rounded-lg border border-white/60">#{o.id.slice(-6)}</span>
                                                        <button onClick={() => { navigator.clipboard.writeText(o.id); showToast(lang === 'ar' ? 'تم نسخ رقم الطلب' : 'Numéro copié', 'success'); }} className="text-slate-400 hover:text-blue-600 transition bg-white/50 p-1.5 rounded-md border border-white/60 shadow-sm" title="نسخ المعرف">
                                                            <Icon name="copy" size={14}/>
                                                        </button>
                                                    </div>
                                                    <span className="text-[11px] font-mono text-slate-500 block mt-1.5" dir="ltr">
                                                        {o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString(lang === 'ar' ? 'ar-DZ' : 'fr-FR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : 'الآن'}
                                                    </span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-black text-blue-700 text-lg mb-1">{formatPrice(o.total)} {t.currency}</div>
                                                    <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold border backdrop-blur-md shadow-sm ${STATUS_COLORS[o.status] ? STATUS_COLORS[o.status].replace('bg-', 'bg-').replace('100', '100/80') : 'bg-gray-100 text-gray-800'}`}>{statusObj.label[lang]}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="px-6 py-5">
                                                <OrderTracker currentStatus={o.status} lang={lang} />
                                                
                                                {o.status !== 'Prêt' && o.status !== 'Annulé' && (
                                                    <div className="mt-5 pt-3 border-t border-white/40 text-[11px] font-bold text-slate-500 flex items-center gap-1.5 bg-white/40 p-2 rounded-xl border border-white/30 shadow-inner">
                                                        <Icon name="truck" size={14} className="text-blue-500" />
                                                        {t.estimatedDelivery} <span className="text-slate-800 bg-white/60 px-2 py-0.5 rounded-md border border-white/60 shadow-sm">{estDelivery.toLocaleDateString()}</span>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="px-4 pb-4 flex justify-between items-center pt-3 border-t border-white/40">
                                                <button aria-label="Toggle Details" onClick={() => setExpandedOrderId(isExpanded ? null : o.id)} className="text-xs text-slate-600 font-bold flex items-center gap-1 hover:text-slate-900 transition bg-white/50 px-3 py-1.5 rounded-xl border border-white/60 shadow-sm">
                                                    {isExpanded ? <Icon name="chevron-up" size={14}/> : <Icon name="chevron-down" size={14}/>} {isExpanded ? 'Masquer' : t.showDetails}
                                                </button>
                                                <div className="flex gap-2 flex-wrap justify-end">
                                                    <a href={`https://wa.me/${uiConfig?.whatsappConfig || '213549179000'}?text=${encodeURIComponent(lang === 'ar' ? `مرحباً، أستفسر عن طلبي رقم #${o.id}` : `Bonjour, je me renseigne sur ma commande #${o.id}`)}`} target="_blank" className="text-xs bg-green-500/90 text-white px-3 py-1.5 rounded-xl font-bold hover:bg-green-500 transition flex items-center gap-1 shadow-sm backdrop-blur-sm border border-green-400">
                                                        <Icon name="message-circle" size={14}/> {t.whatsapp}
                                                    </a>
                                                    {o.status === 'En attente' && (
                                                        <button onClick={() => cancelOrder(o.id)} className="text-xs bg-red-50/80 text-red-600 px-3 py-1.5 rounded-xl font-bold hover:bg-red-100 transition flex items-center gap-1 border border-red-200 backdrop-blur-sm shadow-sm">
                                                            <Icon name="x-circle" size={14}/> {t.cancelOrder}
                                                        </button>
                                                    )}
                                                    <button onClick={() => handleReorder(o)} className="text-xs bg-white/80 text-blue-600 px-3 py-1.5 rounded-xl font-bold hover:bg-white transition flex items-center gap-1 border border-white/60 shadow-sm backdrop-blur-sm">
                                                        <Icon name="rotate-ccw" size={14}/> {t.reOrder}
                                                    </button>
                                                </div>
                                            </div>

                                            {isExpanded && (
                                                <div className="bg-white/40 p-4 border-t border-white/50 text-xs animate-slideUp shadow-inner">
                                                    <p className="font-bold text-slate-800 mb-2">{t.details}:</p>
                                                    <ul className="space-y-2 mb-3">
                                                        {o.items.map((item, idx) => (
                                                            <li key={idx} className="flex justify-between border-b border-white/50 pb-1.5 last:border-0">
                                                                <span className="font-medium text-slate-700">{item.qty}x {item.name[lang] || item.name}</span>
                                                                <span className="font-mono font-bold text-slate-800">{formatPrice(item.price * item.qty)} {t.currency}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                    {o.deliveryFee > 0 && <div className="flex justify-between text-slate-700 pt-2 border-t border-white/50 font-bold"><span>{t.deliveryFee}</span><span>{formatPrice(o.deliveryFee)} {t.currency}</span></div>}
                                                    <p className="mt-3 text-slate-600 italic bg-white/60 p-2.5 rounded-xl border border-white/50 shadow-inner">{o.orderDetails || "No additional notes."}</p>
                                                    {o.items && o.items.some(i => i.selectedVariants?.find(v => v.id.includes('design_'))) && (
                                                        <div className="mt-3 p-2 bg-blue-50/50 rounded border border-blue-100 text-blue-600">هذا الطلب يحتوي على تصميم مرفوع خاص بك.</div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        {view === 'notifications' && (
                            <div className="animate-fadeIn max-w-md mx-auto pb-10"><h2 className="font-bold text-2xl mb-4 text-slate-800">{t.notifications}</h2>{notifications.length === 0 ? <p className="text-center text-slate-400 py-20 ios-glass rounded-3xl border border-white/60"><Icon name="bell-off" size={48} className="mx-auto mb-4 opacity-40"/>{t.noNotifs}</p> : (<div className="space-y-3">{notifications.map(n => (<div key={n.id} onClick={()=>markRead(n.id)} className={`p-4 rounded-2xl border cursor-pointer transition backdrop-blur-md shadow-sm hover:shadow-md ${n.read ? 'bg-white/60 border-white/50' : 'bg-blue-50/80 border-blue-200 shadow-blue-500/10'}`}><div className="flex gap-3"><div className={`mt-1.5 w-2 h-2 rounded-full shrink-0 shadow-sm ${n.read ? 'bg-slate-300' : 'bg-blue-500 animate-pulse'}`}></div><div><p className={`text-sm ${!n.read ? 'font-bold text-slate-900' : 'text-slate-600'}`}>{typeof n.message === 'object' ? n.message[lang] : n.message}</p><span className="text-[10px] text-slate-500 mt-1.5 block dir-ltr text-right bg-white/50 border border-white/60 w-max px-2 py-0.5 rounded-md font-mono">{n.date?.toDate ? n.date.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '—'}</span></div></div></div>))}</div>)}</div>
                        )}
                        {view === 'profile' && <ProfileScreen user={user} t={t} navigate={navigate} showToast={showToast} setView={setView} setUser={setUser} totalSpent={myOrders.filter(o => o.status === 'Prêt').reduce((sum, o) => sum + o.total, 0)} />}
                        {view === 'admin' && <AdminDashboard db={db} appId={appId} updateOrderStatus={updateOrderStatus} lang={lang} t={t} onOpenChat={openChat} showToast={showToast} user={user} />}
                    </main>

                    {productModal && <ProductModal product={productModal} lang={lang} t={t} onAdd={addToCart} onClose={closeProductModal} />}
                    {showQrModal && <QrGeneratorModal t={t} lang={lang} onClose={()=>setShowQrModal(false)} />}
                    {showAIGenerator && <AIGenerator product={selectedDesignProduct} t={t} lang={lang} onClose={()=>setShowAIGenerator(false)} onAddToCart={(p) => { addToCart(p); navigate('cart'); }} />}

                    <div className="fixed bottom-4 left-4 right-4 max-w-md mx-auto ios-glass rounded-3xl flex justify-between px-2 py-3 z-50 shadow-[0_8px_32px_rgba(0,0,0,0.1)] safe-bottom border-t border-white/80">
                        <button aria-label="Home" onClick={()=>navigate('home')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='home'?'active text-blue-600':'text-slate-400'}`}><Icon name="home" size={22}/><span className="text-[10px] font-bold">{t.home}</span></button>
                        <button aria-label="Orders" onClick={()=>navigate('orders')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='orders'?'active text-blue-600':'text-slate-400'}`}><Icon name="list-checks" size={22}/><span className="text-[10px] font-bold">{t.orders}</span></button>
                        <button aria-label="Cart" onClick={()=>navigate('cart')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='cart'?'active text-blue-600':'text-slate-400'}`}><div className="relative"><Icon name="shopping-cart" size={22}/>{cart.length > 0 && <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white shadow-sm animate-pulse"></span>}</div><span className="text-[10px] font-bold">{t.cart}</span></button>
                        <button aria-label="Profile" onClick={()=>navigate('profile')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='profile'?'active text-blue-600':'text-slate-400'}`}><Icon name="user" size={22}/><span className="text-[10px] font-bold">{t.profile}</span></button>
                        {isAdmin && <button aria-label="Admin Panel" onClick={()=>navigate('admin')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='admin'?'active text-blue-600':'text-slate-400'}`}><Icon name="shield" size={22}/><span className="text-[10px] font-bold">{t.admin}</span></button>}
                    </div>

                    {!isAdmin && !activeChat && view !== 'admin' && (
                        <div className="fixed bottom-[6.5rem] right-4 flex flex-col gap-3 z-40 max-w-md mx-auto w-full items-end pr-4 pointer-events-none">
                            <a aria-label="WhatsApp" href={`https://wa.me/${uiConfig?.whatsappConfig || '213549179000'}`} target="_blank" className="pointer-events-auto bg-green-500/90 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-lg hover:scale-110 transition-transform flex items-center justify-center border border-green-400">
                                <Icon name="phone" size={24} />
                            </a>
                            <button aria-label="Live Chat" onClick={() => user.isAnonymous ? showToast(t.chatRegisterPrompt, 'info') : openChat({ userId: user.uid, userName: user.displayName || t.standardUser })} className="pointer-events-auto bg-blue-600/90 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-lg hover:scale-110 transition-transform flex items-center justify-center border border-blue-500">
                                <Icon name="message-square" size={24} />
                            </button>
                        </div>
                    )}

                    {activeChat && (
                        <ChatScreen 
                            user={user} 
                            db={db} 
                            appId={appId} 
                            targetUserId={activeChat.userId} 
                            targetUserName={activeChat.userName} 
                            lang={lang} 
                            t={t} 
                            onBack={closeChat} 
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
    </html>
