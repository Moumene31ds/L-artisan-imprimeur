                    if (diff <= 0) { clearInterval(timer); setTimeLeft({}); return; }
                    
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((diff / 1000 / 60) % 60);
                    const seconds = Math.floor((diff / 1000) % 60);
                    
                    setTimeLeft({ days, hours, minutes, seconds });
                }, 1000);
                return () => clearInterval(timer);
            }, [targetDate]);

                <div className="flex gap-1 text-[10px] font-bold text-white bg-red-600 px-2 py-1 rounded-full items-center">
                    <Icon name="clock" size={10} className="mr-1" />

                <div className="min-h-screen login-bg flex items-center justify-center p-4 relative overflow-hidden">
                    <div className="glass-card w-full max-w-md rounded-3xl p-8 relative z-10 animate-slideUp">
                        <div className="text-center mb-8">
                            <div className="bg-slate-900 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl transform rotate-3 hover:rotate-0 transition-all"><Icon name="printer" size={32} /></div>
                            <h1 className="text-3xl font-black text-slate-800 mb-1 tracking-tight">{t.appTitle} <span className="text-blue-600 text-lg">{t.appSubtitle}</span></h1>
                            <p className="text-slate-500 text-sm">{isLoginView ? t.welcomeBack : t.signup}</p>
                        </div>
                        <div className="absolute top-4 right-4"><button aria-label="Language Toggle" onClick={toggleLang} className="text-slate-400 hover:text-slate-800 transition"><span className="text-xs font-bold uppercase">{lang === 'ar' ? 'EN' : 'عربي'}</span></button></div>
                        <form onSubmit={handleEmailAuth} className="space-y-4">
                            {!isLoginView && (<div className="space-y-1"><label className="text-xs font-bold text-slate-600 ml-1">{t.nameLabel}</label><input type="text" value={name} onChange={e=>setName(e.target.value)} required placeholder={t.nameLabel} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm"/></div>)}
                            <div className="space-y-1"><label className="text-xs font-bold text-slate-600 ml-1">{t.email}</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="name@example.com" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm dir-ltr"/></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-slate-600 ml-1">{t.password}</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm dir-ltr"/></div>
                            {error && <div className="text-red-500 text-xs font-bold text-center bg-red-50 p-2 rounded-lg">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-slate-900/20 hover:bg-slate-800 transition-all flex items-center justify-center gap-2">{loading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : (isLoginView ? t.login : t.createAccount)}</button>
                        </form>
                        <div className="relative my-6"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div><div className="relative flex justify-center text-xs uppercase"><span className="bg-white px-2 text-slate-400">{t.or}</span></div></div>
                        <div className="space-y-3"><button onClick={handleGoogleLogin} type="button" className="w-full bg-white border border-slate-200 text-slate-700 py-3 rounded-xl font-bold hover:bg-slate-50 transition flex items-center justify-center gap-2 text-sm"><Icon name="globe" size={16}/> {t.googleLogin}</button><button onClick={handleGuest} type="button" className="w-full text-slate-400 py-2 text-xs hover:text-slate-600 transition underline decoration-dotted">{t.guestLogin}</button></div>
                        <div className="mt-8 text-center"><p className="text-slate-500 text-sm">{isLoginView ? t.dontHaveAccount : t.haveAccount} <button onClick={() => { setIsLoginView(!isLoginView); setError(""); }} className="text-blue-600 font-bold hover:underline mx-1">{isLoginView ? t.createAccount : t.login}</button></p></div>
                    </div>
                </div>
            );
        };

        const ProfileScreen = ({ user, t, navigate, showToast, setView, ADMIN_EMAIL, setUser }) => {
            const [displayName, setDisplayName] = useState(user.displayName || '');
            const [loading, setLoading] = useState(false);
            const isAnonymous = user.isAnonymous;
            const isAdmin = user.email === ADMIN_EMAIL;
            
            const handleUpdateProfile = async (e) => {
                e.preventDefault(); 
                const trimmedName = displayName.trim();
                if (!trimmedName) return showToast(t.updateFailed, 'error');
                
                setLoading(true);
                try { 
                    const auth = window.firebase.getAuth();
                    await window.firebase.updateProfile(auth.currentUser, { displayName: trimmedName }); 
                    const currentUser = window.firebase.getAuth().currentUser;
                    setUser({
                        uid: currentUser.uid,
                        email: currentUser.email,
                        displayName: trimmedName,
                        isAnonymous: currentUser.isAnonymous,
                        photoURL: currentUser.photoURL
                    });
                    showToast(t.updateSuccess, 'success');
                    setTimeout(() => window.location.reload(), 1000); 
                } 
                catch(e) { 
                    console.error(e);
                    showToast(t.updateFailed, 'error'); 
                } finally { 
                    setLoading(false); 
                }
            };
            
            const handleLogout = async () => {
                await window.firebase.signOut(window.firebase.getAuth());
                navigate('home', true);
            };

            return (
                <div className="animate-fadeIn max-w-md mx-auto pb-10">
                    <h2 className="font-bold text-xl mb-6 flex items-center gap-2"><Icon name="user-circle" size={24}/> {t.profile}</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 mb-6 text-center">
                        <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3"><Icon name={isAnonymous ? "ghost" : "user"} size={40} /></div>
                        <h3 className="text-xl font-bold text-slate-900 mb-1">{user.displayName || (isAnonymous ? t.anonymous : t.email)}</h3>
                        <p className="text-sm text-slate-500 dir-ltr font-mono">{user.email || '—'}</p>
                        <div className={`mt-3 text-xs font-bold px-3 py-1 rounded-full ${isAnonymous ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'} inline-block`}>{isAnonymous ? t.anonymous : t.standardUser}</div>
                    </div>
                    {!isAnonymous && (
                        <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 mb-6">
                            <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icon name="edit" size={18}/> {t.updateProfile}</h4>
                            <form onSubmit={handleUpdateProfile} className="space-y-4">
                                <input aria-label="Name" type="text" value={displayName} onChange={e=>setDisplayName(e.target.value)} required placeholder={t.nameLabel} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"/>
                                <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-500 transition flex items-center justify-center gap-2">{loading ? <div className="loader w-5 h-5 border-white/30 border-t-white"></div> : <><Icon name="save" size={18}/> {t.updateProfile}</>}</button>
                            </form>
                        </div>
                    )}
                    {isAdmin && <div className="text-center mb-6"><button onClick={() => navigate('admin')} className="text-blue-600 hover:text-blue-800 font-bold flex items-center gap-2 mx-auto transition border border-blue-600 rounded-full px-4 py-2 bg-blue-50"><Icon name="shield" size={18}/> {t.adminPanel}</button></div>}
                    <div className="text-center mt-8"><button onClick={handleLogout} className="text-red-500 hover:text-red-700 font-bold flex items-center gap-2 mx-auto transition"><Icon name="log-out" size={20}/> {t.logout}</button></div>
                </div>
            );
        };

        const printInvoice = (order, t) => {
            const printWindow = window.open('', '_blank');
            const totalDiscount = order.discount || 0;
            const subtotal = order.subtotal || 0;

            const htmlContent = `
                <html>
                <head>
                    <title>${t.printInvoice} - #${order.id.slice(-4)}</title>
                    <style>
                        body { font-family: 'Cairo', sans-serif; direction: rtl; margin: 0; padding: 20px; font-size: 12px; }
                        h1 { font-size: 18px; text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 20px; color: #0f172a; }
                        .info { display: flex; justify-content: space-between; margin-bottom: 15px; }
                        .info div { flex-basis: 48%; }
                        .info p { margin: 2px 0; font-weight: 600; }
                        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
                        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
                        th { background-color: #f2f2f2; font-weight: bold; }
                        .total-row td { font-size: 14px; font-weight: bold; background-color: #e0f2f1; }
                        .total-cell { text-align: left; }
                        .status { font-weight: bold; color: ${order.status === 'Prêt' ? '#10b981' : '#f59e0b'}; }
                        .variants ul { list-style: none; padding: 0; margin: 0; font-size: 11px; color: #64748b; }
                        .variants li { margin-top: 2px; }
                        @media print {
                            .no-print { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <div style="text-align: left; margin-bottom: -50px;">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${order.id}" alt="Order QR" style="border: 1px solid #ddd; padding: 4px; border-radius: 4px;" />
                    </div>

                    <h1>${t.appTitle} ${t.appSubtitle} - ${t.printInvoice}</h1>
                    <div class="info">
                        <div>
                            <p>${t.namePh}: ${order.customerName}</p>
                            <p>${t.phonePh}: ${order.phone}</p>
                            <p>${t.wilaya}: ${order.wilaya}</p>
                            <p style="margin-top:5px; font-weight:normal;"><b>${t.orderDetails}:</b><br/>${order.orderDetails || '-'}</p>
                        </div>
                        <div>
                            <p># ${t.orders}: #${order.id.slice(-6)}</p>
                            <p>التاريخ: ${order.createdAt?.toDate ? order.createdAt.toDate().toISOString().split('T')[0] : '—'}</p>
                            <p>الحالة: <span class="status">${STATUS_OPTIONS.find(s=>s.key===order.status)?.label[t.langName] || order.status}</span></p>
                        </div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th>${t.items}</th>
                                <th>${t.qty}</th>
                                <th>سعر الوحدة (${t.currency})</th>
                                <th>المجموع (${t.currency})</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${order.items.map(item => `
                                <tr>
                                    <td>
                                        ${item.name[t.langName] || item.name}
                                        ${item.selectedVariants && item.selectedVariants.length > 0 ? `
                                            <div class="variants">
                                                <ul>
                                                    ${item.selectedVariants.map(v => `<li>${v.label}: ${v.value}</li>`).join('')}
                                                </ul>
                                            </div>
                                        ` : ''}
                                    </td>
                                    <td style="text-align: center;">${item.qty}</td>
                                    <td>${item.price}</td>
                                    <td>${item.price * item.qty}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                        <tfoot>
                            <tr><td colspan="3">${t.subtotal}</td><td class="total-cell">${subtotal} ${t.currency}</td></tr>
                            <tr><td colspan="3">${t.deliveryFee}</td><td class="total-cell">${order.deliveryFee || 0} ${t.currency}</td></tr>
                            ${totalDiscount > 0 ? `<tr><td colspan="3">${t.discount}</td><td class="total-cell" style="color: #ef4444;">- ${totalDiscount} ${t.currency}</td></tr>` : ''}
                            <tr class="total-row"><td colspan="3">${t.total}</td><td class="total-cell">${order.total} ${t.currency}</td></tr>
                        </tfoot>
                    </table>
                    
                    <div class="no-print" style="text-align: center; margin-top: 30px;">
                        <button onclick="window.print()" style="padding: 10px 20px; background-color: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer;">${t.printInvoice}</button>
                    </div>

                </body>
                </html>
            `;
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        };

        const AdminDashboard = ({ db, appId, updateOrderStatus, lang, t, onOpenChat, showToast }) => {
            const [orders, setOrders] = useState([]);
            const [promoCodes, setPromoCodes] = useState([]);
            const [uiConfig, setUiConfig] = useState({ showAnnouncement: false, announcementAr: "", announcementFr: "", stories: [], offers: [] });
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('orders');
            const [searchTerm, setSearchTerm] = useState("");
            const [filterStatus, setFilterStatus] = useState("All");
            
            const [editingOffer, setEditingOffer] = useState(null);

            useEffect(() => {
                if (!db || !appId) return;
                const q = window.firebase.query(window.firebase.collection(db, `artifacts/${appId}/public/data/orders`));
                const unsub = window.firebase.onSnapshot(q, (snap) => {
                    const fetchedOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    fetchedOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)); 
                    setOrders(fetchedOrders);
                    setLoading(false);
                });
                return () => unsub();
            }, [db, appId]);

            useEffect(() => {
                if (!db || !appId) return;
                const codesRef = window.firebase.collection(db, `artifacts/${appId}/public/data/promoCodes`);
                const unsub = window.firebase.onSnapshot(codesRef, (snap) => {
                    setPromoCodes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, [db, appId]);
            
            useEffect(() => {
                if (!db || !appId) return;
                const unsubUi = window.firebase.onSnapshot(window.firebase.doc(db, `artifacts/${appId}/config/ui`), (doc) => {
                    if (doc.exists()) setUiConfig(doc.data());
                });
                return () => unsubUi();
            }, [db, appId]);

            const addPromoCode = async (e) => {
                e.preventDefault();
                const data = new FormData(e.target);
                const code = data.get('code').toUpperCase();
                const discountValue = parseFloat(data.get('discountValue'));
                const minAmount = parseFloat(data.get('minAmount')) || 0;
                if (!code || isNaN(discountValue)) return;
                try {
                    await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes`, code), {
                        code: code, discountType: data.get('discountType'), discountValue: discountValue, minAmount: minAmount, active: true, createdAt: window.firebase.Timestamp.now()
                    });
                    e.target.reset(); showToast(t.codeAdded, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const deletePromoCode = async (codeId) => {
                if (!confirm(t.confirmDeleteCode)) return;
                try { await window.firebase.deleteDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes`, codeId)); showToast(t.codeDeleted, 'success'); } catch (e) { showToast(t.err, 'error'); }
            };
            
            const deleteOrder = async (orderId) => {
                if (!confirm(t.confirmDeleteOrder)) return;
                try { await window.firebase.deleteDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/orders`, orderId)); showToast(t.orderDeleted, 'success'); } catch (e) { showToast(t.err, 'error'); }
            };
            
            const saveConfig = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                try {
                    await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        ...uiConfig,
                        announcementAr: formData.get('announcementAr'),
                        announcementFr: formData.get('announcementFr'),
                        showAnnouncement: formData.get('showAnnouncement') === 'on'
                    }, { merge: true });
                    showToast(t.statusUpdate, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const addStory = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newStory = {
                    id: Date.now(),
                    name: formData.get('name'),
                    img: formData.get('img')
                };
                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        stories: [...(uiConfig.stories || []), newStory]
                    });
                    e.target.reset();
                } catch (e) { showToast(t.err, 'error'); }
            };

            const deleteStory = async (storyId) => {
                try {
                    const newStories = uiConfig.stories.filter(s => s.id !== storyId);
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), { stories: newStories });
                } catch (e) { showToast(t.err, 'error'); }
            };

            const addOrUpdateOffer = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                const offerData = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    price: formData.get('price'),
                    image: formData.get('image'),
                    endDate: formData.get('endDate'),
                    promoCode: formData.get('promoCode') 
                };

                let updatedOffers = [...(uiConfig.offers || [])];

                if (editingOffer) {
                    updatedOffers = updatedOffers.map(o => o.id === editingOffer.id ? { ...o, ...offerData } : o);
                } else {
                    updatedOffers.push({ id: Date.now(), ...offerData });
                }

                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        offers: updatedOffers
                    });
                    e.target.reset();
                    setEditingOffer(null);
                    showToast(t.statusUpdate, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const handleEditOffer = (offer) => {
                setEditingOffer(offer);
                document.querySelector('form[name="offerForm"]').scrollIntoView({ behavior: 'smooth' });
            };

            const cancelEdit = () => {
                setEditingOffer(null);
                document.querySelector('form[name="offerForm"]').reset();
            };

            const deleteOffer = async (offerId) => {
                try {
                    const newOffers = uiConfig.offers.filter(o => o.id !== offerId);
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), { offers: newOffers });
                    if (editingOffer && editingOffer.id === offerId) cancelEdit();
                } catch (e) { showToast(t.err, 'error'); }
            };

            const exportToCSV = () => {
                const header = ["Order ID", "Customer Name", "Phone", "Wilaya", "Status", "Total", "Date"];
                const rows = orders.map(o => [
                    o.id, 
                    o.customerName, 
                    o.phone, 
                    o.wilaya, 
                    o.status, 
                    o.total, 
                    o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString() : ''
                ]);
                const csvContent = "\uFEFF" + [header, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `orders_export_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const revenue = orders.reduce((sum, o) => sum + (o.status !== 'En attente' ? (o.total || 0) : 0), 0);
            
            const filteredOrders = orders.filter(o => 
                (filterStatus === "All" || o.status === filterStatus) &&
                (o.customerName.toLowerCase().includes(searchTerm.toLowerCase()) || o.phone.includes(searchTerm) || o.id.includes(searchTerm))
            );

            return (
                <div className="animate-fadeIn space-y-4 pt-4">
                    <div className="bg-slate-900 text-white p-4 rounded-xl shadow-lg">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="font-bold flex items-center gap-2"><Icon name="layout-dashboard" /> {t.adminPanel}</h2>
                            <span className="text-xs bg-slate-700 px-2 py-1 rounded">Admin</span>
                        </div>
                        <div className="flex gap-4">
                            <div className="flex-1 bg-slate-800 p-3 rounded-lg">
                                <p className="text-xs text-slate-400 mb-1">{t.revenue}</p>
                                <p className="text-xl font-bold text-green-400">{revenue} {t.currency}</p>
                            </div>
                            <div className="flex-1 bg-slate-800 p-3 rounded-lg">
                                <p className="text-xs text-slate-400 mb-1">{t.orders}</p>
                                <p className="text-xl font-bold">{orders.length}</p>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex gap-2 bg-white p-1 rounded-xl shadow-sm border border-slate-100 overflow-x-auto">
                        <button onClick={()=>setTab('orders')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-xs transition ${tab==='orders' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="flex items-center justify-center gap-1"><Icon name="shopping-bag" size={14}/> {t.orders}</span>
                        </button>
                        <button onClick={()=>setTab('chats')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-xs transition ${tab==='chats' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="flex items-center justify-center gap-1"><Icon name="message-circle" size={14}/> {t.chatList}</span>
                        </button>
                        <button onClick={()=>setTab('codes')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-xs transition ${tab==='codes' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="flex items-center justify-center gap-1"><Icon name="percent" size={14}/> {t.discounts}</span>
                        </button>
                        <button onClick={()=>setTab('content')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-xs transition ${tab==='content' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="flex items-center justify-center gap-1"><Icon name="edit-3" size={14}/> {t.manageContent}</span>
                        </button>
                        <button onClick={()=>setTab('offers')} className={`flex-1 min-w-[80px] py-2 rounded-lg font-bold text-xs transition ${tab==='offers' ? 'bg-orange-500 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                            <span className="flex items-center justify-center gap-1"><Icon name="tag" size={14}/> {t.offers}</span>
                        </button>
                    </div>

                    {tab === 'orders' ? (
                        loading ? <div className="flex justify-center py-10"><div className="loader"></div></div> : (
                            <div className="space-y-3 pb-24">
                                <div className="flex gap-2 mb-2">
                                    <input type="text" placeholder={t.search} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="flex-1 p-2 rounded-lg border border-slate-200 text-sm outline-none"/>
                                    <button onClick={exportToCSV} className="bg-green-600 text-white px-3 rounded-lg text-xs font-bold whitespace-nowrap">{t.exportCSV}</button>
                                </div>
                                <div className="flex gap-2 overflow-x-auto pb-2">
                                    <button onClick={() => setFilterStatus("All")} className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${filterStatus === "All" ? "bg-slate-800 text-white" : "bg-white border text-slate-600"}`}>{t.all}</button>
                                    {STATUS_OPTIONS.map(s => (
                                        <button key={s.key} onClick={() => setFilterStatus(s.key)} className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${filterStatus === s.key ? "bg-blue-600 text-white" : "bg-white border text-slate-600"}`}>{s.label[lang]}</button>
                                    ))}
                                </div>

                const recognition = new SpeechRecognition();
                recognition.lang = lang === 'ar' ? 'ar-DZ' : 'fr-FR';
                
                recognition.onstart = () => setIsListening(true);
                recognition.onresult = (e) => {

                recognition.onerror = () => { setIsListening(false); };
                recognition.onend = () => setIsListening(false);
                
                recognition.start();

            const calculateTotal = (cart, promo, zone) => {
                const subtotal = cart.reduce((s,i) => s + (i.price*i.qty), 0);
                let discount = 0;
                if (promo) {
                    if (promo.discountType === 'percent') discount = subtotal * (promo.discountValue / 100);
                    else if (promo.discountType === 'fixed') discount = promo.discountValue;
                    discount = Math.min(discount, subtotal);
                }
                const delivery = zone ? (DELIVERY_FEES[zone] || 0) : 0;
                const finalTotal = subtotal - discount + delivery;
                return { subtotal, discount, delivery, finalTotal: Math.max(0, finalTotal) };
            };

                if (!db || !appId) return showToast(t.conn, "error");

                    if(!window.__firebase_config) return;
                    try {
                        const app = window.firebase.initializeApp(JSON.parse(window.__firebase_config));
                        const auth = window.firebase.getAuth(app);
                        const firestore = window.firebase.getFirestore(app);
                        setDb(firestore);
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) await window.firebase.signInWithCustomToken(auth, window.__initial_auth_token);
                        window.firebase.onAuthStateChanged(auth, (u) => { setUser(u); setAuthLoading(false); });
                    } catch (e) { console.error("Firebase Init Error", e); }
                };
                init();
            }, []);

            useEffect(() => {
                if (!user || !db || !appId) return;
                const notifRef = window.firebase.collection(db, `artifacts/${appId}/users/${user.uid}/notifications`);
                const unsubNotif = window.firebase.onSnapshot(window.firebase.query(notifRef, window.firebase.orderBy('date', 'desc')), (snap) => {
                    const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    setNotifications(list);
                    const fresh = list.find(n => !n.read && (Date.now() - (n.date?.toMillis?.() || 0)) < 5000);
                    if (fresh) showToast(fresh.message[lang] || fresh.message, 'success');
                });
                const ordersRef = window.firebase.collection(db, `artifacts/${appId}/public/data/orders`);
                const unsubOrders = window.firebase.onSnapshot(window.firebase.query(ordersRef, window.firebase.where('customerUserId', '==', user.uid), window.firebase.orderBy('createdAt', 'desc')), (snap) => setMyOrders(snap.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubConfig = window.firebase.onSnapshot(window.firebase.doc(db, `artifacts/${appId}/config/ui`), (d) => { if(d.exists()) setUiConfig(d.data()); });
                return () => { unsubNotif(); unsubOrders(); unsubConfig(); };
            }, [user, db, lang, appId]);

            const showToast = (msg, type='info') => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };
            
            const addToCart = (p) => { 
                setCart(prev => {
                    const cartItemId = `${p.id}-${Date.now()}`; 
                    const newItem = { ...p, cartId: cartItemId, price: p.price, qty: p.qty, selectedVariants: p.selectedVariants || [] };
                    return [...prev, newItem];
                }); 
                showToast(t.addToCart); 
            };

            const updateQty = (cartId, delta) => {
                setCart(prev => prev.map(item => {
                    if(item.cartId === cartId) { const newQty = Math.max(0, item.qty + delta); return {...item, qty: newQty}; }
                    return item;
                }).filter(item => item.qty > 0));
            };
            
            const handleReorder = (order) => {
                const reorderedItems = order.items.map(item => ({ ...item, cartId: `${item.id}-${Date.now()}-${Math.random()}`, name: item.name, price: item.price, qty: item.qty, image: item.image, selectedVariants: item.selectedVariants || [] }));
                setCart(prev => [...prev, ...reorderedItems]); showToast(t.addToCart); navigate('cart');
            };

            const submitOrder = async (e) => {
                e.preventDefault(); if (!user || !db) return showToast(t.conn, "error");
                const formData = new FormData(e.target);
                const { subtotal, finalTotal, discount, delivery } = calculateTotal(cart, appliedPromo, selectedWilayaZone); 
                try {
                    await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/public/data/orders`), {
                        customerUserId: user.uid, customerName: formData.get('name'), phone: formData.get('phone'), wilaya: formData.get('wilaya'), orderDetails: formData.get('orderDetails'), items: cart.map(i => ({ id: i.id, name: i.name, basePrice: i.basePrice, price: i.price, qty: i.qty, image: i.image, selectedVariants: i.selectedVariants || [] })), subtotal, total: finalTotal, discount, deliveryFee: delivery, promoCode: appliedPromo ? { code: appliedPromo.code, value: discount, type: appliedPromo.discountType } : null, status: 'En attente', createdAt: window.firebase.Timestamp.now()
                    });
                    let msg = { fr: "Commande reçue!", ar: "تم استلام الطلب!" };
                    await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/users/${user.uid}/notifications`), { message: msg, date: window.firebase.Timestamp.now(), read: false, type: 'info' });
                    setCart([]); setAppliedPromo(null); setPromoCodeInput(''); navigate('orders'); showToast(t.orderSent);
                } catch (e) { showToast(t.err, "error"); }
            };

            const updateOrderStatus = async (orderId, newStatus, customerId) => {
                if (!db || !appId) return;
                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/orders`, orderId), { status: newStatus });
                    showToast(t.statusUpdate);
                    if (customerId) {
                        const statusLabel = STATUS_OPTIONS.find(s => s.key === newStatus)?.label;
                        let msg = { fr: `Statut: ${statusLabel.fr}`, ar: `الحالة: ${statusLabel.ar}` }; if (newStatus === 'Prêt') msg = { fr: "Commande prête!", ar: "طلبك جاهز!" };
                        await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/users/${customerId}/notifications`), { message: msg, date: window.firebase.Timestamp.now(), read: false, type: 'status', orderId });
                    }
                } catch (e) { showToast("Error updating status", "error"); }
            };
            const markRead = async (id) => { if (db && appId) await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/users/${user.uid}/notifications`, id), {read: true}); };
            
            if (authLoading) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="loader"></div></div>;

            // --- Maintenance Mode Logic ---
            if (UNDER_MAINTENANCE && !bypassMaintenance && (!user || user.email !== ADMIN_EMAIL)) {
                return <MaintenanceScreen t={t} lang={lang} onAdminClick={() => setBypassMaintenance(true)} />;
            }

            if (!user) return <AuthScreen key={lang} t={t} lang={lang} toggleLang={toggleLang} />;
            
            const unreadCount = notifications.filter(n => !n.read).length;
            const filteredProducts = PRODUCTS_DATA.filter(p => 
                p.name[lang].toLowerCase().includes(searchTerm.toLowerCase()) && 
                (activeCategory === 'all' || p.category === activeCategory)
            );

            return (
                <div key={lang} className="min-h-screen bg-slate-50 h-full relative">
                    {toast && <div className={`fixed top-4 left-4 right-4 z-[130] p-4 rounded-lg shadow-xl text-white flex items-center gap-3 animate-fadeIn max-w-sm mx-auto ${toast.type==='error'?'bg-red-600':'bg-slate-800 border-r-4 border-green-400'}`}><Icon name={toast.type==='error'?'alert-circle':'check-circle'} /><span className="font-bold text-sm">{toast.msg}</span></div>}
                    
                    <nav className="bg-white p-4 sticky top-0 z-40 shadow-sm border-b border-slate-100 safe-top">
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 font-bold text-lg text-slate-800 cursor-pointer" onClick={()=>navigate('home')}>
                                <div className="bg-slate-900 text-white p-1.5 rounded-lg"><Icon name="printer" size={20}/></div>
                                <div className="leading-tight hidden sm:block"><span className="block">{t.appTitle}</span><span className="text-blue-600 text-xs">{t.appSubtitle}</span></div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button aria-label="Favorites" onClick={()=>navigate('favorites')} className="p-2 bg-slate-50 rounded-full hover:bg-slate-100 text-red-500 transition"><Icon name="heart" size={20} fill={favorites.length > 0 ? "currentColor" : "none"}/></button>
                                <button aria-label="Notifications" onClick={()=>navigate('notifications')} className="relative p-2 bg-slate-50 rounded-full hover:bg-slate-100 transition"><Icon name="bell" className="text-slate-600"/>{unreadCount > 0 && <span className="absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-[10px] flex items-center justify-center rounded-full shadow border border-white"></span>}</button>
                                <button aria-label="Language Toggle" onClick={toggleLang} className="text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-full hover:bg-slate-200 transition">{lang === 'ar' ? 'EN' : 'عربي'}</button>
                            </div>
                        </div>
                    </nav>

                    <main className="container mx-auto p-4 pb-24 overflow-y-auto" style={{height: 'calc(100vh - 140px)'}}>
                        {view === 'home' && (
                            <div className="animate-fadeIn pb-10">
                                {uiConfig.showAnnouncement && <div className="bg-yellow-400 text-yellow-900 p-2 rounded-xl marquee-container font-black text-[10px] shadow-sm mb-4"><div className="animate-marquee inline-block">{lang === 'ar' ? uiConfig.announcementAr : uiConfig.announcementFr}</div></div>}
                                
                                <div className="mb-4 relative flex items-center gap-2">
                                    <div className="relative flex-1">
                                        <input 
                                            aria-label="Search"
                                            type="text" 
                                            placeholder={isListening ? t.listening : t.search} 
                                            value={searchTerm} 
                                            onChange={(e) => setSearchTerm(e.target.value)} 
                                            className={`w-full p-4 pl-12 bg-white rounded-2xl shadow-sm border outline-none transition-all ${isListening ? 'border-red-400 ring-2 ring-red-100' : 'border-slate-100 focus:ring-2 focus:ring-blue-500'}`}
                                        />
                                        <Icon name="search" className="absolute left-4 top-4 text-slate-400" size={20}/>
                                    </div>
                                    <button 
                                        aria-label="Voice Search"
                                        onClick={startVoiceSearch} 
                                        className={`p-4 rounded-2xl shadow-sm transition-all flex items-center justify-center ${isListening ? 'bg-red-500 text-white animate-pulse shadow-red-500/30' : 'bg-white text-blue-600 border border-slate-100 hover:bg-slate-50'}`}
                                    >
                                        <Icon name="mic" size={24}/>
                                    </button>
                                </div>

                                {/* Categories Filter */}
                                <div className="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-2">
                                    {[{id:'all', name:t.all, icon:'grid'}, {id:'cards', name:t.catCards, icon:'credit-card'}, {id:'flyers', name:t.catFlyers, icon:'file-text'}, {id:'goodies', name:t.catGoodies, icon:'gift'}].map(cat => (
                                        <button 
                                            key={cat.id} 
                                            onClick={() => setActiveCategory(cat.id)}
                                            className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition-all shadow-sm ${activeCategory === cat.id ? 'bg-blue-600 text-white shadow-blue-600/30' : 'bg-white text-slate-600 border border-slate-100 hover:bg-slate-50'}`}
                                        >
                                            <Icon name={cat.icon} size={14} /> {cat.name}
                                        </button>
                                    ))}
                                </div>

                                {!searchTerm && activeCategory === 'all' && (
                                    <>
                                        <StoriesBar stories={uiConfig.stories} />
                                        <div className="bg-slate-900 text-white rounded-2xl p-6 mb-6 shadow-xl relative overflow-hidden">
                                            <div className="relative z-10">
                                                <h2 className="text-xl font-bold mb-1">{t.hello} {user.displayName || (user.isAnonymous ? t.guestLogin.split(' ')[0] : '')}</h2>
                                                <p className="text-slate-300 text-sm mb-4">{t.heroSubtitle}</p>
                                                <div className="flex gap-2">
                                                    <button onClick={()=>navigate('cart')} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-bold text-sm shadow-lg transition">{t.orderNow}</button>
                                                    <button onClick={()=>setShowQrModal(true)} className="bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg font-bold text-sm transition border border-white/20 flex items-center gap-1"><Icon name="qr-code" size={16}/> {t.qrTool}</button>
                                                </div>
                                            </div>
                                            <Icon name="layers" size={140} className={`absolute -bottom-8 text-white opacity-5 rotate-12 ${lang==='ar' ? '-left-8' : '-right-8'}`}/>
                                        </div>
                                        
                                        {uiConfig.offers && uiConfig.offers.length > 0 && (
                                            <div className="mb-8">
                                                <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icon name="tag" size={18} className="text-orange-500"/> {t.specialOffers}</h3>
                                                <div className="flex overflow-x-auto gap-4 hide-scrollbar pb-2">
                                                    {uiConfig.offers.map(offer => (
                                                        <div key={offer.id} className="min-w-[260px] bg-white rounded-xl shadow-md border border-slate-100 overflow-hidden flex-shrink-0 group">
                                                            <div className="h-32 bg-slate-100 relative">
                                                                {offer.image ? (
                                                                    <img src={offer.image} className="w-full h-full object-cover" />
                                                                ) : (
                                                                    <div className="w-full h-full flex items-center justify-center bg-orange-100 text-orange-400">
                                                                        <Icon name="image" size={32}/>
                                                                    </div>
                                                                )}
                                                                <span className="absolute top-2 right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-full">{offer.price}</span>
                                                            </div>
                                                            <div className="p-3">
                                                                <h4 className="font-bold text-sm truncate">{offer.title}</h4>
                                                                <p className="text-xs text-slate-500 line-clamp-2 mt-1">{offer.description}</p>
                                                                {offer.endDate && (
                                                                    <div className="mt-2 flex items-center justify-between">
                                                                        <span className="text-[10px] text-gray-400">{t.endsIn}:</span>
                                                                        <CountdownTimer targetDate={offer.endDate} t={t} />
                                                                    </div>
                                                                )}
                                                                <button onClick={()=>handleGetOffer(offer)} className="w-full mt-3 bg-slate-900 text-white py-2 rounded-lg text-xs font-bold hover:bg-slate-700 transition">{t.getOffer}</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <div className="flex overflow-x-auto gap-4 mb-8 hide-scrollbar">
                                            {FEATURED_PRODUCTS.map(f => (
                                                <div key={f.id} onClick={() => navigate(f.link)} className={`min-w-[280px] flex-shrink-0 p-4 rounded-xl shadow-lg border-2 cursor-pointer transition hover:scale-[1.02] ${f.bg} border-dashed ${f.color.replace('text', 'border')}`}>
                                                    <div className="flex items-center gap-3">
                                                        <div className={`w-8 h-8 rounded-full flex items-center justify-center ${f.color} ${f.bg}`.replace('-50', '-200')}><Icon name={f.icon} size={18}/></div>
                                                        <p className={`font-bold text-sm ${f.color}`}>{f.name[lang]}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}

                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold text-slate-700 flex items-center gap-2"><Icon name="grid" size={18}/> {searchTerm ? t.search : (activeCategory !== 'all' ? t.categories : t.services)}</h3>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                    {filteredProducts.map(p => (
                                        <div key={p.id} className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex flex-col hover:shadow-lg transition-all group relative">
                                            <button aria-label="Add to Favorites" onClick={(e) => { e.stopPropagation(); toggleFavorite(p); }} className="absolute top-2 right-2 z-10 p-1.5 bg-white/80 rounded-full shadow-sm hover:scale-110 transition-transform"><Icon name="heart" size={16} className={favorites.some(f=>f.id===p.id) ? "text-red-500 fill-red-500" : "text-slate-400"}/></button>
                                            <div className="relative overflow-hidden rounded-xl mb-3"><ImageWithSkeleton src={p.image} className={`w-full h-32 group-hover:scale-105 transition-transform duration-300 bg-slate-100 ${p.comingSoon ? 'grayscale' : ''}`}/>{p.badge && <span className={`absolute top-2 left-2 text-[10px] font-bold px-2 py-1 rounded-full text-white shadow-sm ${p.badge === 'bestSeller' ? 'bg-orange-500' : p.badge === 'soon' ? 'bg-slate-500' : 'bg-blue-500'}`}>{t[p.badge]}</span>}</div>
                                            <h3 className="font-bold text-sm text-slate-800 mb-1 leading-tight group-hover:text-blue-600 transition-colors">{p.name[lang]}</h3>
                                            <div className="mt-auto flex justify-between items-center pt-2"><span className={`text-blue-700 font-black text-sm ${p.comingSoon ? 'opacity-50' : ''}`}>{p.comingSoon ? '---' : `${p.basePrice} ${t.currency} +`}</span><button aria-label="Add to Cart" onClick={()=> !p.comingSoon && openProductModal(p)} disabled={p.comingSoon} className={`p-2 rounded-xl shadow-sm transition ${p.comingSoon ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-slate-100 text-slate-700 hover:bg-blue-600 hover:text-white hover:shadow-blue-600/30'}`}><Icon name={p.comingSoon ? "clock" : "plus"} size={16}/></button></div>
                                        </div>
                                    ))}
                                    {filteredProducts.length === 0 && <div className="col-span-2 text-center text-slate-400 py-10 text-sm">لا توجد منتجات مطابقة.</div>}
                                </div>
                            </div>
                        )}
                        {view === 'favorites' && (
                            <div className="animate-fadeIn max-w-md mx-auto pb-10">
                                <h2 className="font-bold text-xl mb-4 flex items-center gap-2"><Icon name="heart" className="text-red-500"/> {t.favorites}</h2>
                                {favorites.length === 0 ? <div className="text-center py-20 text-gray-400"><Icon name="heart-off" size={40} className="mx-auto mb-2"/>{t.noFavorites}</div> : (
                                    <div className="grid grid-cols-2 gap-4">
                                        {favorites.map(p => (
                                            <div key={p.id} className="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex flex-col relative group">
                                                <button aria-label="Remove from Favorites" onClick={() => toggleFavorite(p)} className="absolute top-2 right-2 z-10 p-1.5 bg-white/80 rounded-full text-red-500 hover:bg-red-50 transition"><Icon name="x" size={14}/></button>
                                                <ImageWithSkeleton src={p.image} className="w-full h-32 rounded-lg mb-3 bg-slate-100"/>
                                                <h3 className="font-bold text-sm text-slate-800 mb-1 leading-tight group-hover:text-blue-600 transition">{p.name[lang]}</h3>
                                                <div className="mt-auto flex justify-between items-center pt-2"><span className="text-blue-700 font-bold text-sm">{p.basePrice} {t.currency}</span><button aria-label="Add to Cart" onClick={()=>openProductModal(p)} className="bg-blue-50 text-blue-600 p-2 rounded-xl hover:bg-blue-600 hover:text-white transition"><Icon name="shopping-cart" size={16}/></button></div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        {view === 'cart' && (
                            <div className="animate-fadeIn max-w-md mx-auto pb-10">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="font-bold text-xl flex items-center gap-2"><Icon name="shopping-cart"/> {t.cart}</h2>
                                    {cart.length > 0 && <button onClick={() => setCart([])} className="text-red-500 text-xs font-bold hover:underline flex items-center gap-1"><Icon name="trash" size={14}/> {t.clearCart}</button>}
                                </div>
                                {cart.length === 0 ? <div className="text-center py-10 text-gray-400"><Icon name="shopping-bag" size={40} className="mx-auto mb-2 opacity-50"/>{t.emptyCart}</div> : (
                                    <div className="space-y-4">
                                        {cart.map((i) => (
                                            <div key={i.cartId} className="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex gap-3 items-center hover:border-blue-200 transition">
                                                <ImageWithSkeleton src={i.image} className="w-16 h-16 rounded-xl object-cover bg-slate-100"/>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-sm text-slate-800">{i.name[lang]}</h4>
                                                    <div className="text-xs text-slate-500 mb-2">
                                                        {i.price} {t.currency} {i.selectedVariants && i.selectedVariants.length > 0 && <span className="font-bold text-blue-600">(مخصص)</span>}
                                                        {i.selectedVariants && i.selectedVariants.map(v => <span key={v.id} className="block text-[10px] text-slate-400 truncate">{v.label}: {v.value}</span>)}
                                                    </div>
                                                    <div className="flex items-center gap-3">
                                                        <button aria-label="Decrease Quantity" onClick={()=>updateQty(i.cartId, -1)} className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition">-</button>
                                                        <span className="text-sm font-bold w-4 text-center">{i.qty}</span>
                                                        <button aria-label="Increase Quantity" onClick={()=>updateQty(i.cartId, 1)} className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition">+</button>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-bold text-blue-700 text-sm mb-2">{i.price * i.qty} {t.currency}</div>
                                                    <button aria-label="Remove Item" onClick={()=>updateQty(i.cartId, -100)} className="text-gray-400 hover:text-red-500 p-1 rounded transition"><Icon name="trash-2" size={16}/></button>
                                                </div>
                                            </div>
                                        ))}
                                        
                                        {(() => {
                                            const { subtotal, discount, finalTotal, delivery } = calculateTotal(cart, appliedPromo, selectedWilayaZone); 
                                            return (
                                                <div className="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 mt-4">
                                                    <div className="space-y-3 pb-4 border-b border-slate-100 mb-4">
                                                        <h4 className="font-bold text-slate-700 text-sm">{t.promoPh}</h4>
                                                        {appliedPromo ? (
                                                            <div className="bg-green-50 border border-green-200 text-green-700 font-bold p-3 rounded-xl flex justify-between items-center text-sm">
                                                                <span>{appliedPromo.code} - ({t.discount}: {discount} {t.currency})</span>
                                                                <button aria-label="Remove Promo" onClick={() => { setAppliedPromo(null); setPromoCodeInput(''); }} className="text-red-500 hover:text-red-700 p-1"><Icon name="x" size={16} /></button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex gap-2">
                                                                <input aria-label="Promo Code" type="text" value={promoCodeInput} onChange={e => setPromoCodeInput(e.target.value)} placeholder={t.promoPh} className="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 dir-ltr uppercase transition" />
                                                                <button onClick={() => applyPromoCode(promoCodeInput)} disabled={!promoCodeInput.trim()} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-3 rounded-xl font-bold text-sm transition disabled:opacity-50 shadow-md">{t.promoApply}</button>
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="space-y-2 text-sm mb-2 text-slate-600">
                                                        <div className="flex justify-between"><span>{t.subtotal}</span><span>{subtotal} {t.currency}</span></div>
                                                        {delivery > 0 && <div className="flex justify-between text-slate-800 font-bold"><span>{t.deliveryFee}</span><span>+ {delivery} {t.currency}</span></div>}
                                                        {discount > 0 && <div className="flex justify-between text-green-600 font-bold"><span>{t.discount}</span><span>- {discount} {t.currency}</span></div>}
                                                    </div>
                                                    <div className="flex justify-between font-bold border-t border-slate-200 pt-3"><span>{t.total}</span><span className="text-2xl text-blue-800 font-black">{finalTotal} {t.currency}</span></div>
                                                    
                                                    <form onSubmit={submitOrder} className="space-y-3 mt-5">
                                                        <input aria-label="Name" required name="name" defaultValue={user.displayName || ''} placeholder={t.namePh} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition"/>
                                                        <input aria-label="Phone" required name="phone" type="tel" placeholder={t.phonePh} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition dir-ltr"/>
                                                        <div className="relative">
                                                            <select aria-label="Wilaya" name="wilaya" required onChange={(e) => {
                                                                const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === e.target.value);
                                                                setSelectedWilayaZone(w ? w.zone : null);
                                                            }} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition appearance-none text-slate-800">
                                                                <option value="">{t.selectWilaya}</option>
                                                                {WILAYAS.map((w) => <option key={w.id} value={`${w.id} - ${w.name}`} className="text-black">{w.id} - {w.name}</option>)}
                                                            </select>
                                                            <Icon name="chevron-down" className="absolute left-3 top-3.5 text-slate-400 pointer-events-none" size={16}/>
                                                        </div>
                                                        <textarea aria-label="Order Details" required name="orderDetails" placeholder={t.orderDetails} rows="3" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 transition"></textarea>
                                                        <button className="w-full bg-green-600 hover:bg-green-500 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-green-600/30 transition flex justify-center gap-2 active:scale-95" disabled={cart.length === 0}><Icon name="check" size={18}/> {t.confirm}</button>
                                                    </form>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}
                            </div>
                        )}
                        {view === 'orders' && (
                            <div className="animate-fadeIn space-y-4 max-w-md mx-auto pb-10">
                                <h2 className="font-bold text-xl mb-2">{t.myOrders}</h2>
                                {myOrders.length === 0 ? <p className="text-center text-gray-400 py-10">{t.noOrders}</p> : myOrders.map(o => {
                                    const statusObj = STATUS_OPTIONS.find(s => s.key === o.status) || STATUS_OPTIONS[0];
                                    const isExpanded = expandedOrderId === o.id;
                                    const currentStatusIndex = STATUS_OPTIONS.findIndex(s => s.key === o.status);
                                    
                                    return (
                                        <div key={o.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition">
                                            <div className="p-4 border-b border-gray-50 flex justify-between items-center bg-slate-50/50">
                                                <div>
                                                    <span className="font-bold text-lg text-slate-800">#{o.id.slice(-4)}</span>
                                                    <span className="text-[10px] text-gray-400 block">{o.createdAt?.toDate ? o.createdAt.toDate().toISOString().split('T')[0] : '—'}</span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-bold text-blue-700 text-lg">{o.total} {t.currency}</div>
                                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${STATUS_COLORS[o.status]}`}>{statusObj.label[lang]}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="px-6 py-4">
                                                <div className="relative border-l-2 border-slate-200 space-y-6 ml-2">
                                                    {STATUS_OPTIONS.map((step, idx) => {
                                                        const isCompleted = idx <= currentStatusIndex;
                                                        const isCurrent = idx === currentStatusIndex;
                                                        return (
                                                            <div key={step.key} className="relative pl-4">
                                                                <div className={`absolute -left-[9px] top-1 w-4 h-4 rounded-full border-2 transition-all ${isCompleted ? 'bg-blue-600 border-blue-600 shadow-sm' : 'bg-white border-slate-300'}`}>
                                                                    {isCompleted && <Icon name="check" size={10} className="text-white absolute top-0.5 left-0.5"/>}
                                                                </div>
                                                                <p className={`text-xs font-bold transition-all ${isCurrent ? 'text-blue-700 scale-105' : isCompleted ? 'text-slate-700' : 'text-slate-300'}`}>
                                                                    {step.label[lang]}
                                                                </p>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            <div className="px-4 pb-4 flex justify-between items-center pt-2 border-t border-slate-50">
                                                <button aria-label="Toggle Details" onClick={() => setExpandedOrderId(isExpanded ? null : o.id)} className="text-xs text-slate-500 font-bold flex items-center gap-1 hover:text-slate-800 transition">
                                                    {isExpanded ? <Icon name="chevron-up" size={14}/> : <Icon name="chevron-down" size={14}/>} {isExpanded ? 'Masquer' : t.showDetails}
                                                </button>
                                                <div className="flex gap-2">
                                                    {o.status === 'En attente' && (
                                                        <button onClick={() => deleteOrder(o.id)} className="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-xl font-bold hover:bg-red-100 transition flex items-center gap-1">
                                                            <Icon name="x-circle" size={14}/> {t.cancelOrder}
                                                        </button>
                                                    )}
                                                    <button onClick={() => handleReorder(o)} className="text-xs bg-blue-50 text-blue-600 px-3 py-1.5 rounded-xl font-bold hover:bg-blue-100 transition flex items-center gap-1">
                                                        <Icon name="rotate-ccw" size={14}/> {t.reOrder}
                                                    </button>
                                                </div>
                                            </div>

                                            {isExpanded && (
                                                <div className="bg-slate-50 p-4 border-t border-slate-100 text-xs animate-slideUp">
                                                    <p className="font-bold text-slate-700 mb-2">{t.details}:</p>
                                                    <ul className="space-y-2 mb-3">
                                                        {o.items.map((item, idx) => (
                                                            <li key={idx} className="flex justify-between border-b border-slate-200 pb-1 last:border-0">
                                                                <span>{item.qty}x {item.name[lang]}</span>
                                                                <span className="font-mono">{item.price * item.qty} {t.currency}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                    {o.deliveryFee > 0 && <div className="flex justify-between text-slate-500 pt-1 border-t border-slate-200"><span>{t.deliveryFee}</span><span>{o.deliveryFee} {t.currency}</span></div>}
                                                    <p className="mt-3 text-slate-500 italic bg-white p-2 rounded-lg border border-slate-200">{o.orderDetails || "No additional notes."}</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        {view === 'notifications' && (
                            <div className="animate-fadeIn max-w-md mx-auto pb-10"><h2 className="font-bold text-xl mb-4">{t.notifications}</h2>{notifications.length === 0 ? <p className="text-center text-gray-400 py-10">{t.noNotifs}</p> : (<div className="space-y-3">{notifications.map(n => (<div key={n.id} onClick={()=>markRead(n.id)} className={`p-4 rounded-xl border cursor-pointer transition ${n.read ? 'bg-white border-slate-100' : 'bg-blue-50 border-blue-100 shadow-sm'}`}><div className="flex gap-3"><div className={`mt-1.5 w-2 h-2 rounded-full shrink-0 ${n.read ? 'bg-slate-300' : 'bg-blue-500'}`}></div><div><p className={`text-sm ${!n.read ? 'font-bold text-slate-900' : 'text-slate-600'}`}>{typeof n.message === 'object' ? n.message[lang] : n.message}</p><span className="text-[10px] text-slate-400 mt-1 block dir-ltr text-right">{n.date?.toDate ? n.date.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '—'}</span></div></div></div>))}</div>)}</div>
                        )}
                        {view === 'profile' && <ProfileScreen user={user} t={t} navigate={navigate} showToast={showToast} ADMIN_EMAIL={ADMIN_EMAIL} setUser={setUser} />}
                        {view === 'admin' && (isAdmin ? <AdminDashboard db={db} appId={appId} updateOrderStatus={updateOrderStatus} lang={lang} t={t} onOpenChat={openChat} showToast={showToast} /> : <div className="text-center py-20 text-red-500 font-bold">{t.accessDenied}</div>)}
                    </main>

                    {productModal && <ProductModal product={productModal} lang={lang} t={t} onAdd={addToCart} onClose={closeProductModal} />}
                    {showQrModal && <QrGeneratorModal t={t} lang={lang} onClose={()=>setShowQrModal(false)} />}

                    <div className="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 flex justify-between px-2 py-3 pb-safe z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.03)] safe-bottom">
                        <button aria-label="Home" onClick={()=>navigate('home')} className={`flex flex-col items-center gap-1 nav-btn ${view==='home'?'active text-slate-900':'text-slate-400'}`}><Icon name="home" size={22}/><span className="text-[10px] font-bold">{t.home}</span></button>
                        <button aria-label="Orders" onClick={()=>navigate('orders')} className={`flex flex-col items-center gap-1 nav-btn ${view==='orders'?'active text-slate-900':'text-slate-400'}`}><Icon name="list-checks" size={22}/><span className="text-[10px] font-bold">{t.orders}</span></button>
                        <button aria-label="Cart" onClick={()=>navigate('cart')} className={`flex flex-col items-center gap-1 nav-btn ${view==='cart'?'active text-slate-900':'text-slate-400'}`}><div className="relative"><Icon name="shopping-cart" size={22}/>{cart.length > 0 && <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border border-white"></span>}</div><span className="text-[10px] font-bold">{t.cart}</span></button>
                        <button aria-label="Profile" onClick={()=>navigate('profile')} className={`flex flex-col items-center gap-1 nav-btn ${view==='profile'?'active text-slate-900':'text-slate-400'}`}><Icon name="user" size={22}/><span className="text-[10px] font-bold">{t.profile}</span></button>
                        {isAdmin && <button aria-label="Admin Panel" onClick={()=>navigate('admin')} className={`flex flex-col items-center gap-1 nav-btn ${view==='admin'?'active text-slate-900':'text-slate-400'}`}><Icon name="shield" size={22}/><span className="text-[10px] font-bold">{t.admin}</span></button>}
                    </div>

                    {!isAdmin && !activeChat && view !== 'admin' && (
                        <div className="fixed bottom-24 right-4 flex flex-col gap-3 z-40">
                             <a aria-label="WhatsApp" href="https://wa.me/213549179000" target="_blank" className="bg-green-500 text-white p-3 rounded-full shadow-lg hover:scale-110 transition-transform flex items-center justify-center"><Icon name="phone" size={24} fill="white" className="text-white"/></a>
                            <button aria-label="Chat with us" onClick={() => openChat({ userId: user.uid, userName: user.displayName })} className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3 rounded-full shadow-2xl shadow-blue-600/40 animate-slideUp hover:scale-110 transition-transform flex items-center gap-2 group"><Icon name="message-circle" size={24} /></button>
                        </div>
                    )}
                    {activeChat && <ChatScreen user={user} db={db} appId={appId} targetUserId={isAdmin ? activeChat.userId : null} targetUserName={isAdmin ? activeChat.userName : null} lang={lang} t={t} onBack={closeChat} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
