            formData.append("file", file);

                    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((diff / 1000 / 60) % 60);
                    const seconds = Math.floor((diff / 1000) % 60);

            const [uploadQuality, setUploadQuality] = useState(null); 
            const [uploadedDesignUrl, setUploadedDesignUrl] = useState(null);
            const imageRef = useRef(null);

            const handleMouseMove = (e) => {
                if (!imageRef.current) return;
                const card = imageRef.current;
                const box = card.getBoundingClientRect();
                const x = e.clientX - box.left;
                const y = e.clientY - box.top;
                const centerX = box.width / 2;
                const centerY = box.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            };
            const handleMouseLeave = () => {
                if (imageRef.current) imageRef.current.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                setUploadQuality('checking');
                
                const uploadedUrl = await uploadFileToCloudinary(file);
                
                if (uploadedUrl) {
                    setUploadedDesignUrl(uploadedUrl);
                    setUploadQuality('good');
                } else {
                    setUploadQuality('bad');
                }
            };

            const handleSelect = (variantId, value) => setSelections(prev => ({ ...prev, [variantId]: value }));
            const unitPrice = calculateVariantPrice(product, selections);
            const finalTotal = unitPrice * qty;
            
            const handleAdd = () => {
                const selectedVariants = product.variants.map(v => ({ id: v.id, label: v.label[lang], value: selections[v.id], price: v.options.find(opt => opt.value === selections[v.id])?.price || 0 })).filter(v => v.value);
                
                if (uploadedDesignUrl) {
                    selectedVariants.push({ id: 'design_url', label: lang === 'ar' ? 'التصميم المرفوع' : 'Design Uploadé', value: uploadedDesignUrl, price: 0 });
                }

                onAdd({ ...product, price: unitPrice, qty: qty, totalPrice: finalTotal, selectedVariants: selectedVariants });
                onClose();
            };
            
            const handleShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: product.name[lang],
                            text: t.heroSubtitle,
                            url: window.location.href
                        });
                    } catch (error) { console.log('Error sharing', error); }
                }
            };
            
            const isFormComplete = product.variants.every(v => selections[v.id]);

            return (
                <div className="fixed inset-0 z-[110] bg-slate-900/40 backdrop-blur-sm flex items-end justify-center animate-fadeIn">
                    <div className="ios-glass w-full max-w-md rounded-t-[3rem] p-6 animate-slideUp safe-bottom relative overflow-hidden">
                        <div className="w-12 h-1.5 bg-slate-300 rounded-full mx-auto mb-6 opacity-50"></div>
                        <div className="flex justify-between items-start mb-4 border-b border-slate-200/50 pb-3">
                            <h3 className="text-xl font-bold text-slate-900">{product.name[lang]}</h3>
                            <div className="flex gap-2">
                                <button onClick={handleShare} className="text-slate-500 hover:text-blue-500 p-2 bg-white/50 rounded-full transition shadow-sm"><Icon name="share-2" size={20}/></button>
                                <button onClick={onClose} className="text-slate-500 hover:text-red-500 p-2 bg-white/50 rounded-full transition shadow-sm"><Icon name="x" size={20}/></button>
                            </div>
                        </div>

                        <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2 hide-scrollbar">
                            <div ref={imageRef} onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave} className="w-full h-48 rounded-2xl overflow-hidden mb-4 shadow-lg transition-transform duration-200 ease-out cursor-crosshair border border-white/50 tilt-card">
                                <ImageWithSkeleton src={product.image} className="w-full h-full object-cover pointer-events-none" alt="Product Preview" />
                            </div>

                            <div className="mb-4 bg-white/40 p-4 rounded-xl border border-dashed border-slate-300/60 hover:bg-white/60 transition shadow-inner">
                                <label className="flex items-center justify-between cursor-pointer">
                                    <span className="font-bold text-sm text-slate-700 flex items-center gap-2">
                                        <Icon name="upload-cloud" size={18} className="text-blue-500"/> {t.uploadDesign}
                                    </span>
                                    <input type="file" accept="image/*,.pdf" className="hidden" onChange={handleFileUpload}/>
                                    <span className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-md cursor-pointer hover:bg-blue-500 transition-colors">Upload</span>
                                </label>
                                {uploadQuality === 'checking' && <div className="mt-3 text-xs text-blue-600 flex items-center gap-2 animate-pulse"><div className="loader w-3 h-3"></div> {t.uploading}</div>}
                                {uploadQuality === 'good' && <div className="mt-3 text-xs text-green-600 flex items-center gap-2"><Icon name="check-circle" size={14}/> {t.qualityGood}</div>}
                                {uploadQuality === 'bad' && <div className="mt-3 text-xs text-red-500 flex items-center gap-2"><Icon name="alert-triangle" size={14}/> حدث خطأ أثناء الرفع</div>}
                            </div>

                            {product.variants.map(v => (
                                <div key={v.id} className="pb-3 border-b border-slate-200/50">
                                    <h4 className="font-bold text-slate-700 mb-2 text-sm">{v.label[lang]}</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {v.options.map((opt, index) => (
                                            <button key={index} onClick={() => handleSelect(v.id, opt.value)} className={`px-4 py-2 text-sm rounded-xl transition-all border font-medium ${selections[v.id] === opt.value ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-105' : 'bg-white/60 text-slate-700 border-white/40 hover:bg-white/80'}`}>{opt.value} {opt.price > 0 && <span className={`text-xs ${selections[v.id] === opt.value ? 'text-slate-300' : 'text-slate-400'}`}> (+{formatPrice(opt.price)} {t.currency})</span>}</button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                            <div className="pt-3 border-t border-slate-200/50 flex items-center justify-between">
                                <span className="font-bold text-slate-700 text-sm">{t.qty}:</span>
                                <div className="flex items-center gap-3 bg-white/60 rounded-full p-1 border border-white/50 backdrop-blur-sm shadow-inner">
                                    <button onClick={()=>setQty(Math.max(1, qty - 1))} className="w-8 h-8 rounded-full bg-white shadow flex items-center justify-center text-slate-600 hover:text-blue-600 transition font-bold">-</button>
                                    <input type="number" value={qty} onChange={(e) => setQty(Math.max(1, parseInt(e.target.value) || 1))} className="text-sm font-bold w-12 text-center bg-transparent outline-none"/>
                                    <button onClick={()=>setQty(qty + 1)} className="w-8 h-8 rounded-full bg-white shadow flex items-center justify-center text-slate-600 hover:text-blue-600 transition font-bold">+</button>
                                </div>
                            </div>
                        </div>
                        
                        <div className="mt-6 pt-4 border-t border-slate-200/50 relative z-10">
                            <div className="flex justify-between items-center mb-3"><span className="text-lg font-bold text-slate-600">{t.finalPrice}:</span><span className="text-2xl font-black text-blue-700 bg-blue-50/50 px-3 py-1 rounded-xl border border-blue-100">{formatPrice(finalTotal)} <span className="text-sm">{t.currency}</span></span></div>
                            <button onClick={handleAdd} disabled={!isFormComplete || qty < 1 || uploadQuality === 'checking'} className="w-full bg-blue-600/90 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-600/30 transition flex justify-center gap-2 disabled:opacity-50 active:scale-95 backdrop-blur-md"><Icon name="shopping-cart" size={18}/> {t.add} ({qty})</button>
                        </div>
                    </div>
                </div>
            );
        };

        const MessageBubble = memo(({ msg, isMe, lang }) => (
            <div className={`flex flex-col mb-3 ${isMe ? 'items-end' : 'items-start'} animate-slideUp`}>
                <div className={`max-w-[80%] px-4 py-2.5 rounded-2xl shadow-sm text-sm relative break-words backdrop-blur-sm ${isMe ? 'bg-blue-600/90 text-white rounded-br-none' : 'bg-white/80 border border-white text-slate-800 rounded-bl-none'}`}>{msg.content}</div>
                <span className="text-[10px] text-slate-400 mt-1 px-1 font-mono">{msg.createdAt?.toDate ? msg.createdAt.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}</span>
            </div>
        ));

        const ChatScreen = ({ user, db, appId, targetUserId, targetUserName, lang, t, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState("");
            const dummy = useRef();
            const chatId = targetUserId || user.uid; 
            const isAdmin = ADMIN_EMAILS.includes(user.email);
            
            useEffect(() => {
                const q = window.firebase.query(window.firebase.collection(db, `artifacts/${appId}/chats/${chatId}/messages`), window.firebase.orderBy('createdAt', 'asc'));
                const unsub = window.firebase.onSnapshot(q, (snap) => { 
                    setMessages(snap.docs.map(d => ({id: d.id, ...d.data()}))); 
                });
                return () => unsub();
            }, [chatId]);

            useEffect(() => {
                setTimeout(() => dummy.current?.scrollIntoView({ behavior: 'smooth' }), 200);
            }, [messages]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if(!text.trim()) return;
                const safeText = text.trim();
                const msgData = { content: safeText, senderId: user.uid, createdAt: window.firebase.Timestamp.now(), read: false };
                await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/chats/${chatId}/messages`), msgData);
                await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/chats/${chatId}`), { lastMessage: safeText, lastMessageTime: window.firebase.Timestamp.now(), userName: isAdmin ? targetUserName : (user.displayName || 'Guest'), userId: chatId }, { merge: true });
                setText("");
            };
            return (
                <div className="fixed inset-0 z-[100] bg-slate-50 flex flex-col h-full animate-fadeIn pattern-dots">
                    <div className="ios-glass-nav p-3 px-4 shadow-sm flex items-center gap-3 sticky top-0 z-10 safe-top">
                        <button aria-label="Back" onClick={onBack} className="p-2 -ml-2 hover:bg-slate-200/50 rounded-full transition"><Icon name={lang==='ar'?"arrow-right":"arrow-left"} /></button>
                        <div className="relative">
                            <div className="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold shadow-lg">{isAdmin ? <Icon name="user" size={20}/> : <Icon name="headset" size={20}/>}</div>
                            {!isAdmin && <span className="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>}
                        </div>
                        <div><h3 className="font-bold text-slate-800 leading-tight">{isAdmin ? targetUserName : t.managerName}</h3><p className="text-xs text-blue-600 font-bold flex items-center gap-1">{!isAdmin && <span className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>} {isAdmin ? 'Client' : t.online}</p></div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 pb-24 scroll-smooth">
                        {messages.length === 0 && <div className="text-center py-20 opacity-50"><div className="bg-white/60 backdrop-blur-md p-4 rounded-full inline-block mb-3 shadow-sm"><Icon name="message-circle" size={32} className="text-blue-400"/></div><p>{t.noMessages}</p></div>}
                        {messages.map(msg => <MessageBubble key={msg.id} msg={msg} isMe={msg.senderId === user.uid} lang={lang} />)}
                        <div ref={dummy}></div>
                    </div>
                    <div className="ios-glass p-3 safe-bottom border-t border-white/50">
                        <form onSubmit={sendMessage} className="flex items-end gap-2 max-w-4xl mx-auto">
                            <input value={text} onChange={e => setText(e.target.value)} placeholder={t.typeMessage} className="flex-1 bg-white/70 border border-white/60 rounded-2xl px-5 py-3.5 focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none resize-none shadow-inner" />
                            <button aria-label="Send" disabled={!text.trim()} type="submit" className="bg-blue-600/90 hover:bg-blue-700 disabled:opacity-50 text-white p-3.5 rounded-full shadow-lg shadow-blue-600/20 transition-all transform active:scale-95"><Icon name={lang === 'ar' ? "send-horizontal" : "send"} className={lang === 'ar' ? "rotate-180" : ""} /></button>
                        </form>
                    </div>
                </div>
            );
        };

        const AuthScreen = ({ t, lang, toggleLang }) => {
            const [isLoginView, setIsLoginView] = useState(true);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [name, setName] = useState("");
            const handleGoogleLogin = async () => {
                setLoading(true); setError("");
                try {
                    const provider = new window.firebase.GoogleAuthProvider();
                    await window.firebase.signInWithPopup(window.firebase.getAuth(), provider);
                } catch (e) { setError(lang === 'ar' ? 'فشل الاتصال بجوجل.' : 'Échec de connexion Google.'); setLoading(false); }
            };
            const handleEmailAuth = async (e) => {
                e.preventDefault();
                setLoading(true); setError("");
                const auth = window.firebase.getAuth();
                try {
                    if (isLoginView) await window.firebase.signInWithEmailAndPassword(auth, email, password);
                    else { const res = await window.firebase.createUserWithEmailAndPassword(auth, email, password); await window.firebase.updateProfile(res.user, { displayName: name.trim() }); }
                } catch (e) { setError(e.message); setLoading(false); }
            };
            const handleGuest = async () => { setLoading(true); try { await window.firebase.signInAnonymously(window.firebase.getAuth()); } catch(e) { setError("Guest login failed"); setLoading(false); } };
            return (
                <div className="min-h-screen login-bg flex items-center justify-center p-4 relative overflow-hidden">
                    <div className="glass-card w-full max-w-md rounded-[2.5rem] p-8 relative z-10 animate-slideUp">
                        <div className="text-center mb-8">
                            <div className="bg-slate-900/90 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl transform rotate-3 hover:rotate-0 transition-all"><Icon name="printer" size={32} /></div>
                            <h1 className="text-3xl font-black text-slate-800 mb-1 tracking-tight">{t.appTitle} <span className="text-blue-600 text-lg">{t.appSubtitle}</span></h1>
                            <p className="text-slate-500 text-sm">{isLoginView ? t.welcomeBack : t.signup}</p>
                        </div>
                        <div className="absolute top-4 right-4"><button aria-label="Language Toggle" onClick={toggleLang} className="text-slate-400 hover:text-slate-800 transition bg-white/50 px-3 py-1 rounded-full shadow-sm"><span className="text-xs font-bold uppercase">{lang === 'ar' ? 'EN' : 'عربي'}</span></button></div>
                        <form onSubmit={handleEmailAuth} className="space-y-4">
                            {!isLoginView && (<div className="space-y-1"><label className="text-xs font-bold text-slate-600 ml-1">{t.nameLabel}</label><input type="text" value={name} onChange={e=>setName(e.target.value)} required placeholder={t.nameLabel} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm shadow-inner"/></div>)}
                            <div className="space-y-1"><label className="text-xs font-bold text-slate-600 ml-1">{t.email}</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="name@example.com" className="w-full p-3 bg-white/60 border border-white/50 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm dir-ltr shadow-inner"/></div>
                            <div className="space-y-1"><label className="text-xs font-bold text-slate-600 ml-1">{t.password}</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••" className="w-full p-3 bg-white/60 border border-white/50 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm dir-ltr shadow-inner"/></div>
                            {error && <div className="text-red-500 text-xs font-bold text-center bg-red-50/80 backdrop-blur p-2 rounded-lg border border-red-200">{error}</div>}
                            <button type="submit" disabled={loading} className="w-full bg-slate-900/90 backdrop-blur text-white py-3.5 rounded-xl font-bold shadow-lg shadow-slate-900/20 hover:bg-slate-800 transition-all flex items-center justify-center gap-2">{loading ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : (isLoginView ? t.login : t.createAccount)}</button>
                        </form>
                        <div className="relative my-6"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-300/50"></div></div><div className="relative flex justify-center text-xs uppercase"><span className="bg-[#f0f2f5] px-2 text-slate-500 rounded">{t.or}</span></div></div>
                        <div className="space-y-3">
                            <button onClick={handleGoogleLogin} type="button" className="w-full bg-white/80 backdrop-blur border border-white/50 text-slate-700 py-3 rounded-xl font-bold hover:bg-white transition flex items-center justify-center gap-2 text-sm shadow-sm">
                                <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                                {t.googleLogin}
                            </button>
                            <button onClick={handleGuest} type="button" className="w-full text-slate-500 py-2 text-xs hover:text-slate-700 transition underline decoration-dotted">{t.guestLogin}</button>
                        </div>
                        <div className="mt-8 text-center"><p className="text-slate-500 text-sm">{isLoginView ? t.dontHaveAccount : t.haveAccount} <button onClick={() => { setIsLoginView(!isLoginView); setError(""); }} className="text-blue-600 font-bold hover:underline mx-1">{isLoginView ? t.createAccount : t.login}</button></p></div>
                    </div>
                </div>
            );
        };

        const ProfileScreen = ({ user, t, navigate, showToast, setView, setUser, totalSpent }) => {
            const [displayName, setDisplayName] = useState(user.displayName || '');
            const [loading, setLoading] = useState(false);
            const isAnonymous = user.isAnonymous;
            const isAdmin = ADMIN_EMAILS.includes(user.email);
            
            const handleUpdateProfile = async (e) => {
                e.preventDefault(); 
                const trimmedName = displayName.trim();
                if (!trimmedName) return showToast(t.updateFailed, 'error');
                
                setLoading(true);
                try { 
                    const auth = window.firebase.getAuth();
                    await window.firebase.updateProfile(auth.currentUser, { displayName: trimmedName }); 
                    const currentUser = window.firebase.getAuth().currentUser;
                    setUser({
                        uid: currentUser.uid,
                        email: currentUser.email,
                        displayName: trimmedName,
                        isAnonymous: currentUser.isAnonymous,
                        photoURL: currentUser.photoURL
                    });
                    showToast(t.updateSuccess, 'success');
                } 
                catch(e) { 
                    console.error(e);
                    showToast(t.updateFailed, 'error'); 
                } finally { 
                    setLoading(false); 
                }
            };
            
            const handleLogout = async () => {
                await window.firebase.signOut(window.firebase.getAuth());
                navigate('home', true);
            };

            return (
                <div className="animate-fadeIn max-w-md mx-auto pb-10">
                    <h2 className="font-bold text-xl mb-6 flex items-center gap-2"><Icon name="user-circle" size={24}/> {t.profile}</h2>
                    <div className="ios-glass p-6 rounded-[2rem] shadow-lg mb-6 text-center">
                        <div className="w-20 h-20 bg-blue-100/50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 backdrop-blur-md border border-white/60"><Icon name={isAnonymous ? "ghost" : "user"} size={40} /></div>
                        <h3 className="text-xl font-bold text-slate-900 mb-1">{user.displayName || (isAnonymous ? t.anonymous : t.email)}</h3>
                        <p className="text-sm text-slate-500 dir-ltr font-mono">{user.email || '—'}</p>
                        <div className={`mt-3 text-xs font-bold px-3 py-1 rounded-full ${isAnonymous ? 'bg-yellow-100/50 text-yellow-800 border-yellow-200' : 'bg-green-100/50 text-green-800 border-green-200'} inline-block border backdrop-blur-sm`}>{isAnonymous ? t.anonymous : t.standardUser}</div>
                        
                        {!isAnonymous && (
                            <div className="mt-5 pt-5 border-t border-slate-200/50 text-left">
                                {(() => {
                                    const currentTier = getUserTier(totalSpent || 0);
                                    const nextTier = LOYALTY_TIERS.slice().reverse().find(t => t.minSpent > (totalSpent || 0));
                                    const progress = nextTier ? ((totalSpent || 0) / nextTier.minSpent) * 100 : 100;
                                    
                                    return (
                                        <div className="bg-white/60 p-4 rounded-2xl border border-white/50 shadow-sm">
                                            <div className="flex justify-between items-center mb-2">
                                                <span className="font-bold text-slate-700 text-sm">مستوى الولاء:</span>
                                                <span className={`text-xs font-bold px-3 py-1 rounded-full border ${currentTier.color}`}>
                                                    <Icon name="award" size={14} className="inline mr-1 mb-0.5"/> {currentTier.name[t.langName === 'العربية' ? 'ar' : 'fr']}
                                                </span>
                                            </div>
                                            {currentTier.discountPercent > 0 && (
                                                <p className="text-[10px] text-green-600 font-bold mb-3">أنت تستمتع بخصم دائم {currentTier.discountPercent}% على كل طلباتك!</p>
                                            )}
                                            {nextTier && (
                                                <div>
                                                    <div className="w-full bg-slate-200 rounded-full h-2 mb-1 overflow-hidden">
                                                        <div className="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                    <p className="text-[10px] text-slate-500 text-center">باقي {formatPrice(nextTier.minSpent - (totalSpent || 0))} د.ج للوصول لمستوى {nextTier.name[t.langName === 'العربية' ? 'ar' : 'fr']}</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </div>
                    {!isAnonymous && (
                        <div className="ios-glass p-6 rounded-[2rem] shadow-lg mb-6">
                            <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2"><Icon name="edit" size={18}/> {t.updateProfile}</h4>
                            <form onSubmit={handleUpdateProfile} className="space-y-4">
                                <input aria-label="Name" type="text" value={displayName} onChange={e=>setDisplayName(e.target.value)} required placeholder={t.nameLabel} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-inner"/>
                                <button type="submit" disabled={loading} className="w-full bg-blue-600/90 backdrop-blur text-white py-3 rounded-xl font-bold hover:bg-blue-500 transition flex items-center justify-center gap-2">{loading ? <div className="loader w-5 h-5 border-white/30 border-t-white"></div> : <><Icon name="save" size={18}/> {t.updateProfile}</>}</button>
                            </form>
                        </div>
                    )}
                    
                    <div className="ios-glass p-4 rounded-3xl shadow-lg mb-6 text-center cursor-pointer hover:bg-white/50 transition border border-white/50" onClick={() => navigate('privacy')}>
                        <div className="text-slate-600 font-bold flex items-center justify-center gap-2">
                            <Icon name="shield-check" size={18} className="text-blue-500" /> {t.privacyPolicy}
                        </div>
                    </div>

                    {isAdmin && <div className="text-center mb-6"><button onClick={() => navigate('admin')} className="text-blue-600 hover:text-blue-800 font-bold flex items-center gap-2 mx-auto transition border border-blue-600/30 rounded-full px-4 py-2 bg-blue-50/50 backdrop-blur-sm shadow-sm"><Icon name="shield" size={18}/> {t.adminPanel}</button></div>}
                    <div className="text-center mt-8"><button onClick={handleLogout} className="text-red-500 hover:text-red-700 font-bold flex items-center gap-2 mx-auto transition bg-red-50 px-4 py-2 rounded-full shadow-sm"><Icon name="log-out" size={20}/> {t.logout}</button></div>
                </div>
            );
        };

        const printInvoice = (order, t) => {
            const printWindow = window.open('', '_blank');
            const totalDiscount = order.discount || 0;
            const subtotal = order.subtotal || 0;
            const printDate = new Date().toLocaleString('fr-FR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit' });
            const langDir = t.langName === 'العربية' ? 'rtl' : 'ltr';

            const htmlContent = `
                <html dir="${langDir}">
                <head>
                    <title>Facture / فاتورة - #${order.id.slice(-6)}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
                    <style>
                        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 40px; font-size: 14px; color: #1e293b; background: #fff; }

                        .invoice-title p { margin: 5px 0 0; font-size: 13px; font-weight: 600; }
                        .info-grid { display: flex; justify-content: space-between; margin-bottom: 30px; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; }
                        .info-block { width: 48%; }
                        .info-block h3 { margin-top: 0; font-size: 12px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
                        .info-block p { margin: 4px 0; font-weight: 600; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { border-bottom: 1px solid #e2e8f0; padding: 12px 8px; text-align: ${langDir === 'rtl' ? 'right' : 'left'}; }
                        th { background-color: #f1f5f9; font-weight: 700; color: #475569; }
                        .total-section { width: 50%; margin-left: auto; margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
                        html[dir="rtl"] .total-section { margin-left: 0; margin-right: auto; }
                        .total-row { display: flex; justify-content: space-between; padding: 8px 0; }
                        .total-row.final { font-size: 18px; font-weight: 700; color: #0f172a; border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 10px; }
                        .footer { margin-top: 50px; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 20px; color: #64748b; font-size: 12px; }
                        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #e0e7ff; color: #3730a3; }
                        @media print { .no-print { display: none; } body { padding: 0; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div class="header-brand">
                            <h1>L'Artisan Imprimeur</h1>
                            <p>Imprimerie Numérique & Offset</p>
                            <p>📍 Oran, Algérie</p>
                            <p>📞 +213 549 17 90 00</p>
                        </div>
                        <div class="invoice-title">
                            <h2>${t.printInvoice}</h2>
                            <p># ${order.id}</p>
                            <p style="color:#64748b; font-weight:normal;">${printDate}</p>
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=${order.id}" style="margin-top: 10px; border-radius: 4px;"/>
                        </div>
                    </div>

                    <div class="info-grid">
                        <div class="info-block">
                            <h3>Client / الزبون</h3>
                            <p>${order.customerName}</p>
                            <p dir="ltr" style="text-align: ${langDir === 'rtl' ? 'right' : 'left'};">${order.phone}</p>
                            <p>${order.wilaya}</p>
                        </div>
                        <div class="info-block">
                            <h3>Commande / الطلب</h3>
                            <p>Date: ${order.createdAt?.toDate ? order.createdAt.toDate().toISOString().split('T')[0] : '—'}</p>
                            <p>Status: <span class="status-badge">${STATUS_OPTIONS.find(s=>s.key===order.status)?.label[t.langName === 'العربية' ? 'ar' : 'fr'] || order.status}</span></p>
                        </div>
                    </div>

                    ${order.orderDetails ? `<div style="margin-bottom: 20px; padding: 15px; background: #f8fafc; border-right: ${langDir === 'rtl' ? '4px solid #3b82f6' : 'none'}; border-left: ${langDir === 'ltr' ? '4px solid #3b82f6' : 'none'}; border-radius: 4px; font-size: 13px;"><b>Notes:</b><br/> ${order.orderDetails}</div>` : ''}

                    <table>
                        <thead>
                            <tr>
                                <th>${t.items}</th>
                                <th style="width: 100px;">${t.qty}</th>
                                <th style="width: 120px;">Prix U.</th>
                                <th style="width: 120px;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${order.items.map(item => `
                                <tr>
                                    <td>
                                        <strong>${item.name[t.langName === 'العربية' ? 'ar' : 'fr'] || item.name}</strong>
                                        ${item.selectedVariants && item.selectedVariants.length > 0 ? `
                                            <div style="font-size: 11px; color: #64748b; margin-top: 4px;">
                                                ${item.selectedVariants.map(v => `${v.label}: ${v.value.startsWith('http') ? `<a href="${v.value}" target="_blank">Lien Design</a>` : v.value}`).join(' | ')}
                                            </div>
                                        ` : ''}
                                    </td>
                                    <td>${item.qty}</td>
                                    <td>${formatPrice(item.price)} ${t.currency}</td>
                                    <td>${formatPrice(item.price * item.qty)} ${t.currency}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    
                    <div class="total-section">
                        <div class="total-row"><span>${t.subtotal}</span><span>${formatPrice(subtotal)} ${t.currency}</span></div>
                        <div class="total-row"><span>${t.deliveryFee}</span><span>${formatPrice(order.deliveryFee || 0)} ${t.currency}</span></div>
                        ${totalDiscount > 0 ? `<div class="total-row" style="color: #ef4444;"><span>${t.discount}</span><span>- ${formatPrice(totalDiscount)} ${t.currency}</span></div>` : ''}
                        <div class="total-row final"><span>${t.total}</span><span>${formatPrice(order.total)} ${t.currency}</span></div>
                    </div>
                    
                    <div class="footer">
                        <p>Merci pour votre confiance. / شكراً لثقتكم بنا.</p>
                        <p>L'Artisan Imprimeur © ${new Date().getFullYear()}</p>
                    </div>

                    <div class="no-print" style="text-align: center; margin-top: 40px;">
                        <button onclick="window.print()" style="padding: 12px 24px; background-color: #0f172a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;">🖨️ ${t.printInvoice}</button>
                    </div>
                </body>
                </html>
            `;
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        };

        const AdminDashboard = ({ db, appId, updateOrderStatus, lang, t, onOpenChat, showToast, user }) => {
            const [orders, setOrders] = useState([]);
            const [promoCodes, setPromoCodes] = useState([]);
            const [uiConfig, setUiConfig] = useState({ showAnnouncement: false, announcementAr: "", announcementFr: "", stories: [], offers: [], maintenanceMode: false });
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('orders');
            const [searchTerm, setSearchTerm] = useState("");
            const [filterStatus, setFilterStatus] = useState("All");
            const [editingOffer, setEditingOffer] = useState(null);
            
            const [offerImgUrl, setOfferImgUrl] = useState("");
            const [storyImgUrl, setStoryImgUrl] = useState("");

            const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

            if (!user || !ADMIN_EMAILS.includes(user.email)) {
                return <div className="text-center py-20 text-red-500 font-bold">{t.accessDenied}</div>;
            }

            useEffect(() => {
                if (!db || !appId) return;
                const q = window.firebase.query(
                    window.firebase.collection(db, `artifacts/${appId}/public/data/orders`),
                    window.firebase.orderBy('createdAt', 'desc'),
                    window.firebase.limit(100)
                );
                
                let isInitialLoad = true;
                
                const unsub = window.firebase.onSnapshot(q, (snap) => {
                    const fetchedOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setOrders(fetchedOrders);
                    setLoading(false);
                    
                    if (!isInitialLoad) {
                        snap.docChanges().forEach((change) => {
                            if (change.type === 'added') {
                                audioRef.current.play().catch(e => console.log("Audio play prevented", e));
                                showToast(t.newOrderAlert, "success");
                            }
                        });
                    }
                    isInitialLoad = false;
                });
                return () => unsub();
            }, [db, appId, t]);

            useEffect(() => {
                if (!db || !appId) return;
                const codesRef = window.firebase.collection(db, `artifacts/${appId}/public/data/promoCodes`);
                const unsub = window.firebase.onSnapshot(codesRef, (snap) => {
                    setPromoCodes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, [db, appId]);
            
            useEffect(() => {
                if (!db || !appId) return;
                const unsubUi = window.firebase.onSnapshot(window.firebase.doc(db, `artifacts/${appId}/config/ui`), (doc) => {
                    if (doc.exists()) setUiConfig(doc.data());
                });
                return () => unsubUi();
            }, [db, appId]);

            const addPromoCode = async (e) => {
                e.preventDefault();
                const data = new FormData(e.target);
                const code = data.get('code').trim().toUpperCase();
                const discountValue = parseFloat(data.get('discountValue'));
                const minAmount = parseFloat(data.get('minAmount')) || 0;
                const expiryDate = data.get('expiryDate');
                const maxUses = parseInt(data.get('maxUses')) || 0;
                
                const partnerName = data.get('partnerName')?.trim() || null;
                const commissionRate = parseFloat(data.get('commissionRate')) || 0;

                if (!code || isNaN(discountValue)) return;
                try {
                    await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes`, code), {
                        code: code, 
                        discountType: data.get('discountType'), 
                        discountValue: discountValue, 
                        minAmount: minAmount, 
                        expiryDate: expiryDate || null,
                        maxUses: maxUses || null,
                        currentUses: 0,
                        partnerName: partnerName,
                        commissionRate: commissionRate,
                        active: true, 
                        createdAt: window.firebase.Timestamp.now()
                    });
                    e.target.reset(); showToast(t.codeAdded, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const deletePromoCode = async (codeId) => {
                if (!confirm(t.confirmDeleteCode)) return;
                try { await window.firebase.deleteDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes`, codeId)); showToast(t.codeDeleted, 'success'); } catch (e) { showToast(t.err, 'error'); }
            };
            
            const deleteOrder = async (orderId) => {
                if (!confirm(t.confirmDeleteOrder)) return;
                try { 
                    const docPath = `artifacts/${appId}/public/data/orders/${orderId}`;
                    await window.firebase.deleteDoc(window.firebase.doc(db, docPath)); 
                    showToast(t.orderDeleted, 'success'); 
                } catch (e) { 
                    console.error("Error deleting order:", e);
                    showToast(t.err, 'error'); 
                }
            };
            
            const bulkDeleteCancelled = async () => {
                const cancelledOrders = orders.filter(o => o.status === 'Annulé');
                if(cancelledOrders.length === 0) return showToast('لا توجد طلبات ملغاة للحذف', 'info');
                if(!confirm(`هل أنت متأكد من حذف ${cancelledOrders.length} طلب ملغى دفعة واحدة؟`)) return;
                
                try {
                    showToast('جاري الحذف...', 'info');
                    for (const order of cancelledOrders) {
                        await window.firebase.deleteDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/orders/${order.id}`));
                    }
                    showToast('تم التنظيف بنجاح!', 'success');
                } catch(e) {
                    showToast(t.err, 'error');
                }
            };

            const saveConfig = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                try {
                    await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        ...uiConfig,
                        announcementAr: formData.get('announcementAr'),
                        announcementFr: formData.get('announcementFr'),
                        showAnnouncement: formData.get('showAnnouncement') === 'on',
                        maintenanceMode: formData.get('maintenanceMode') === 'on'
                    }, { merge: true });
                    showToast(t.statusUpdate, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const handleStoryUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                showToast("جاري الرفع لـ Cloudinary...", "info");
                const url = await uploadFileToCloudinary(file);
                if (url) {
                    setStoryImgUrl(url);
                    showToast("تم الرفع بنجاح", "success");
                } else {
                    showToast("فشل الرفع", "error");
                }
            };

            const addStory = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const finalUrl = formData.get('img') || storyImgUrl;

                if (!finalUrl) {
                    showToast("يجب إرفاق ملف", "error");
                    return;
                }

                const newStory = {
                    id: Date.now(),
                    name: formData.get('name'),
                    img: finalUrl
                };
                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        stories: [...(uiConfig.stories || []), newStory]
                    });
                    e.target.reset();
                    setStoryImgUrl("");
                    showToast("تمت الإضافة", "success");
                } catch (e) { showToast(t.err, 'error'); }
            };

            const deleteStory = async (storyId) => {
                try {
                    const newStories = uiConfig.stories.filter(s => s.id !== storyId);
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), { stories: newStories });
                } catch (e) { showToast(t.err, 'error'); }
            };

            const handleOfferImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                showToast("جاري الرفع لـ Cloudinary...", "info");
                const url = await uploadFileToCloudinary(file);
                if (url) {
                    setOfferImgUrl(url);
                    showToast("تم رفع الصورة بنجاح", "success");
                } else {
                    showToast("فشل رفع الصورة", "error");
                }
            };

            const addOrUpdateOffer = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                const offerData = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    price: formData.get('price'),
                    image: formData.get('image') || offerImgUrl || (editingOffer ? editingOffer.image : ""),
                    endDate: formData.get('endDate'),
                    promoCode: formData.get('promoCode').trim().toUpperCase()
                };

                let updatedOffers = [...(uiConfig.offers || [])];

                if (editingOffer) {
                    updatedOffers = updatedOffers.map(o => o.id === editingOffer.id ? { ...o, ...offerData } : o);
                } else {
                    updatedOffers.push({ id: Date.now(), ...offerData });
                }

                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        offers: updatedOffers
                    });
                    e.target.reset();
                    setEditingOffer(null);
                    setOfferImgUrl("");
                    showToast(t.statusUpdate, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const handleEditOffer = (offer) => {
                setEditingOffer(offer);
                setOfferImgUrl(offer.image || "");
                document.querySelector('form[name="offerForm"]').scrollIntoView({ behavior: 'smooth' });
            };

            const cancelEdit = () => {
                setEditingOffer(null);
                setOfferImgUrl("");
                document.querySelector('form[name="offerForm"]').reset();
            };

            const deleteOffer = async (offerId) => {
                try {
                    const newOffers = uiConfig.offers.filter(o => o.id !== offerId);
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), { offers: newOffers });
                    if (editingOffer && editingOffer.id === offerId) cancelEdit();
                } catch (e) { showToast(t.err, 'error'); }
            };

            const exportToCSV = () => {
                const escapeCSV = (str) => `"${String(str).replace(/"/g, '""')}"`;
                const header = ["Order ID", "Customer Name", "Phone", "Wilaya", "Status", "Total", "Date", "Details"];
                const rows = orders.map(o => [
                    escapeCSV(o.id), 
                    escapeCSV(o.customerName), 
                    escapeCSV(o.phone), 
                    escapeCSV(o.wilaya), 
                    escapeCSV(o.status), 
                    escapeCSV(o.total), 
                    escapeCSV(o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString() : ''),
                    escapeCSV(o.orderDetails)
                ]);
                const csvContent = "\uFEFF" + [header, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `orders_export_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const todayDate = new Date();
            todayDate.setHours(0,0,0,0);
            const todayOrders = orders.filter(o => o.createdAt?.toDate && o.createdAt.toDate() >= todayDate);
            const todayRevenue = todayOrders.reduce((sum, o) => sum + (o.status !== 'Annulé' ? (o.total || 0) : 0), 0);
            const pendingCount = orders.filter(o => o.status === 'En attente').length;
            const revenue = orders.reduce((sum, o) => sum + (o.status !== 'En attente' && o.status !== 'Annulé' ? (o.total || 0) : 0), 0);
            
            const filteredOrders = orders.filter(o => 
                (filterStatus === "All" || o.status === filterStatus) &&
                (o.customerName.toLowerCase().includes(searchTerm.toLowerCase()) || o.phone.includes(searchTerm) || o.id.includes(searchTerm))
            );

            // حساب أكثر الولايات طلباً للإحصائيات الجديدة
            const wilayaStats = useMemo(() => {
                const stats = {};
                orders.forEach(o => {
                    if(o.status !== 'Annulé' && o.wilaya) {
                        stats[o.wilaya] = (stats[o.wilaya] || 0) + 1;
                    }
                });
                return Object.entries(stats).sort((a,b)=>b[1]-a[1]).slice(0,3);
            }, [orders]);

            // حساب إحصائيات الشركاء
            const partnerStats = useMemo(() => {
                const stats = {};
                orders.forEach(o => {
                    if(o.status !== 'Annulé' && o.promoCode && o.promoCode.partnerName) {
                        const pName = o.promoCode.partnerName;
                        if(!stats[pName]) stats[pName] = { count: 0, revenue: 0, commission: 0 };
                        stats[pName].count += 1;
                        stats[pName].revenue += o.total;
                        stats[pName].commission += ((o.subtotal || 0) * (o.promoCode.commissionRate / 100));
                    }
                });
                return Object.entries(stats).map(([name, data]) => ({ name, ...data })).sort((a,b) => b.revenue - a.revenue);
            }, [orders]);

            return (
                <div className="animate-fadeIn space-y-4 pt-4">
                    {uiConfig.maintenanceMode && (
                        <div className="bg-red-500/90 text-white p-3 rounded-2xl shadow-lg mb-4 backdrop-blur-md animate-pulse font-bold flex items-center justify-center gap-2 border border-red-400">
                            <Icon name="alert-triangle" /> وضع الصيانة مفعل حالياً! لا يمكن للزبائن الطلب.
                        </div>
                    )}
                    
                    <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="bg-gradient-to-br from-slate-800 to-slate-900 text-white p-4 rounded-3xl shadow-lg border border-slate-700">
                            <p className="text-xs text-slate-400 mb-1">{t.revenue} (الإجمالي)</p>
                            <p className="text-xl font-black text-green-400">{formatPrice(revenue)} {t.currency}</p>
                        </div>
                        <div className="bg-gradient-to-br from-blue-600 to-blue-800 text-white p-4 rounded-3xl shadow-lg border border-blue-500">
                            <p className="text-xs text-blue-200 mb-1">أرباح اليوم</p>
                            <p className="text-xl font-black">{formatPrice(todayRevenue)} {t.currency}</p>
                        </div>
                        <div className="bg-white/60 backdrop-blur p-4 rounded-3xl shadow-sm border border-white/80">
                            <p className="text-xs text-slate-500 mb-1">طلبات قيد الانتظار</p>
                            <p className="text-xl font-black text-orange-500">{pendingCount}</p>
                        </div>
                        <div className="bg-white/60 backdrop-blur p-4 rounded-3xl shadow-sm border border-white/80">
                            <p className="text-xs text-slate-500 mb-1">إجمالي الطلبات</p>
                            <p className="text-xl font-black text-slate-800">{orders.length}</p>
                        </div>
