            useEffect(() => {
                const timer = setInterval(() => {
                    const diff = new Date(targetDate) - new Date();
                    if (diff <= 0) { clearInterval(timer); setTimeLeft({}); return; }
                    
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                    const minutes = Math.floor((diff / 1000 / 60) % 60);
                    const seconds = Math.floor((diff / 1000) % 60);
                    
                    setTimeLeft({ days, hours, minutes, seconds });
                }, 1000);
                return () => clearInterval(timer);
            }, [targetDate]);

            if (Object.keys(timeLeft).length === 0) return null;

            return (
                <div className="flex gap-1 text-[10px] font-bold text-white bg-red-600/90 backdrop-blur-md px-2 py-1 rounded-full items-center">
                    <Icon name="clock" size={10} className="mr-1" />

                        a.style.display = 'none';

                const x = e.clientX - box.left;
                const y = e.clientY - box.top;
                const centerX = box.width / 2;
                const centerY = box.height / 2;
                const rotateX = ((y - centerY) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            };
            const handleMouseLeave = () => {
                if (imageRef.current) imageRef.current.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
            };

            const handleFileUpload = (e) => {

                        setTimeout(() => {

                setLoading(true);
                try {

                    const currentUser = window.firebase.getAuth().currentUser;
                    setUser({
                        uid: currentUser.uid,
                        email: currentUser.email,

                        isAnonymous: currentUser.isAnonymous,

                    });

        const printInvoice = (order, t) => {

            const subtotal = order.subtotal || 0;

            const htmlContent = `
                <html>

                            <p># ${t.orders}: #${order.id.slice(-6)}</p>

                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="width: 60px;">الصورة</th>

            printWindow.document.write(htmlContent);
            printWindow.document.close();
        };

        const AdminDashboard = ({ db, appId, updateOrderStatus, lang, t, onOpenChat, showToast, user, ADMIN_EMAIL }) => {
            const [orders, setOrders] = useState([]);
            const [promoCodes, setPromoCodes] = useState([]);
            const [uiConfig, setUiConfig] = useState({ showAnnouncement: false, announcementAr: "", announcementFr: "", stories: [], offers: [] });
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('orders');
            const [searchTerm, setSearchTerm] = useState("");
            const [filterStatus, setFilterStatus] = useState("All");
            
            const [editingOffer, setEditingOffer] = useState(null);

            // الحماية المزدوجة لواجهة الإدارة
            if (user?.email !== ADMIN_EMAIL) {
                return <div className="text-center py-20 text-red-500 font-bold">{t.accessDenied}</div>;
            }

            useEffect(() => {
                if (!db || !appId) return;
                const q = window.firebase.query(window.firebase.collection(db, `artifacts/${appId}/public/data/orders`));
                const unsub = window.firebase.onSnapshot(q, (snap) => {
                    const fetchedOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    fetchedOrders.sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                        return timeB - timeA;
                    }); 
                    setOrders(fetchedOrders);
                    setLoading(false);
                });
                return () => unsub();
            }, [db, appId]);

            useEffect(() => {
                if (!db || !appId) return;
                const codesRef = window.firebase.collection(db, `artifacts/${appId}/public/data/promoCodes`);
                const unsub = window.firebase.onSnapshot(codesRef, (snap) => {
                    setPromoCodes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, [db, appId]);
            
            useEffect(() => {
                if (!db || !appId) return;
                const unsubUi = window.firebase.onSnapshot(window.firebase.doc(db, `artifacts/${appId}/config/ui`), (doc) => {
                    if (doc.exists()) setUiConfig(doc.data());
                });
                return () => unsubUi();
            }, [db, appId]);

            const addPromoCode = async (e) => {
                e.preventDefault();
                const data = new FormData(e.target);
                const code = data.get('code').trim().toUpperCase();
                const discountValue = parseFloat(data.get('discountValue'));
                const minAmount = parseFloat(data.get('minAmount')) || 0;
                const expiryDate = data.get('expiryDate');
                const maxUses = parseInt(data.get('maxUses')) || 0;
                
                if (!code || isNaN(discountValue)) return;
                try {
                    await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes`, code), {
                        code: code, 
                        discountType: data.get('discountType'), 
                        discountValue: discountValue, 
                        minAmount: minAmount, 
                        expiryDate: expiryDate || null,
                        maxUses: maxUses || null,
                        currentUses: 0,
                        active: true, 
                        createdAt: window.firebase.Timestamp.now()
                    });
                    e.target.reset(); showToast(t.codeAdded, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const deletePromoCode = async (codeId) => {
                if (!confirm(t.confirmDeleteCode)) return;
                try { await window.firebase.deleteDoc(window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes`, codeId)); showToast(t.codeDeleted, 'success'); } catch (e) { showToast(t.err, 'error'); }
            };
            
            const deleteOrder = async (orderId) => {
                if (!confirm(t.confirmDeleteOrder)) return;
                try { 
                    const docPath = `artifacts/${appId}/public/data/orders/${orderId}`;
                    await window.firebase.deleteDoc(window.firebase.doc(db, docPath)); 
                    showToast(t.orderDeleted, 'success'); 
                } catch (e) { 
                    console.error("Error deleting order:", e);
                    showToast(t.err, 'error'); 
                }
            };
            
            const saveConfig = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                try {
                    await window.firebase.setDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        ...uiConfig,
                        announcementAr: formData.get('announcementAr'),
                        announcementFr: formData.get('announcementFr'),
                        showAnnouncement: formData.get('showAnnouncement') === 'on'
                    }, { merge: true });
                    showToast(t.statusUpdate, 'success');
                } catch (e) { showToast(t.err, 'error'); }
            };

            const addStory = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newStory = {
                    id: Date.now(),
                    name: formData.get('name'),
                    img: formData.get('img')
                };
                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        stories: [...(uiConfig.stories || []), newStory]
                    });
                    e.target.reset();
                } catch (e) { showToast(t.err, 'error'); }
            };

            const deleteStory = async (storyId) => {
                try {
                    const newStories = uiConfig.stories.filter(s => s.id !== storyId);
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), { stories: newStories });
                } catch (e) { showToast(t.err, 'error'); }
            };

            const addOrUpdateOffer = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                const offerData = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    price: formData.get('price'),
                    image: formData.get('image'),
                    endDate: formData.get('endDate'),
                    promoCode: formData.get('promoCode').trim().toUpperCase()
                };

                let updatedOffers = [...(uiConfig.offers || [])];

                if (editingOffer) {
                    updatedOffers = updatedOffers.map(o => o.id === editingOffer.id ? { ...o, ...offerData } : o);
                } else {
                    updatedOffers.push({ id: Date.now(), ...offerData });
                }

                try {
                    await window.firebase.updateDoc(window.firebase.doc(db, `artifacts/${appId}/config/ui`), {
                        offers: updatedOffers
                    });

                    setEditingOffer(null);

            };

            const deleteOffer = async (offerId) => {
                try {
                    const newOffers = uiConfig.offers.filter(o => o.id !== offerId);

            const exportToCSV = () => {
                const header = ["Order ID", "Customer Name", "Phone", "Wilaya", "Status", "Total", "Date"];
                const rows = orders.map(o => [
                    o.id, 
                    o.customerName, 
                    o.phone, 
                    o.wilaya, 
                    o.status, 
                    o.total, 
                    o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString() : ''
                ]);
                const csvContent = "\uFEFF" + [header, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `orders_export_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            const filteredOrders = orders.filter(o => 
                (filterStatus === "All" || o.status === filterStatus) &&

                            <div className="flex-1 bg-white/10 backdrop-blur p-3 rounded-2xl border border-white/5">

                            <div className="flex-1 bg-white/10 backdrop-blur p-3 rounded-2xl border border-white/5">

                    <div className="flex gap-2 ios-glass p-1.5 rounded-2xl shadow-sm overflow-x-auto">

                        <button onClick={()=>setTab('chats')} className={`flex-1 min-w-[80px] py-2.5 rounded-xl font-bold text-xs transition ${tab==='chats' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-white/50'}`}>

                        <button onClick={()=>setTab('codes')} className={`flex-1 min-w-[80px] py-2.5 rounded-xl font-bold text-xs transition ${tab==='codes' ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-white/50'}`}>

                                <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">

                                        <option value="fixed">{t.currency}</option>

                                    <input required name="discountValue" type="number" step="0.01" min="1" placeholder={t.discountValue} className="w-2/3 p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 dir-ltr shadow-inner"/>
                                </div>
                                <input name="minAmount" type="number" step="0.01" min="0" placeholder={t.minOrderAmount} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 dir-ltr shadow-inner"/>

                                    <div className="w-1/2 relative">
                                        <label className="text-[10px] text-slate-500 font-bold ml-1">{t.expiryDate}</label>

                                    </div>
                                    <div className="w-1/2 relative">
                                        <label className="text-[10px] text-slate-500 font-bold ml-1">{t.maxUses}</label>
                                        <input name="maxUses" type="number" min="1" placeholder="مثال: 100" className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-inner"/>
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-blue-600/90 backdrop-blur text-white py-3.5 rounded-xl font-bold transition hover:bg-blue-500 flex justify-center items-center gap-2 mt-2">
                                    <Icon name="plus" size={18}/> {t.createCode}
                                </button>
                            </form>

                            <h3 className="font-bold text-lg pt-4 px-2 flex justify-between items-center">{t.activeCodes} <span className="text-sm bg-slate-200/50 backdrop-blur text-slate-700 px-3 py-0.5 rounded-full">{promoCodes.length}</span></h3>
                            <div className="space-y-3">
                                {promoCodes.map(code => (
                                    <div key={code.id} className="ios-glass p-4 rounded-2xl shadow-sm flex justify-between items-center">
                                        <div>
                                            <div className="font-bold text-slate-900 text-lg dir-ltr">{code.code}</div>
                                            <div className="flex flex-wrap gap-1 mt-1">
                                                <span className={`text-[10px] font-bold bg-white/50 px-2 py-0.5 rounded-md ${code.discountType==='percent'?'text-red-600':'text-green-600'}`}>
                                                    {code.discountType === 'percent' ? `${code.discountValue}%` : `${code.discountValue} ${t.currency}`}
                                                </span>
                                                {code.expiryDate && <span className="text-[10px] font-bold text-slate-500 bg-white/50 px-2 py-0.5 rounded-md flex items-center gap-1"><Icon name="clock" size={10}/> {code.expiryDate}</span>}
                                                {code.maxUses && <span className="text-[10px] font-bold text-blue-600 bg-blue-50/50 px-2 py-0.5 rounded-md">
                                                    {code.currentUses || 0}/{code.maxUses} {t.currentUses}
                                                </span>}
                                            </div>
                                        </div>
                                        <button aria-label="Delete" onClick={() => deletePromoCode(code.id)} className="text-red-500 hover:text-red-700 p-2.5 bg-red-50/50 rounded-full transition border border-red-100"><Icon name="trash" size={18}/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : tab === 'offers' ? (
                        <div className="animate-fadeIn space-y-6 pb-28">
                            <div className="ios-glass p-5 rounded-2xl shadow-sm">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2">
                                    <Icon name="tag" size={18}/> {editingOffer ? t.updateOffer : t.manageOffers}
                                </h3>
                                <form name="offerForm" onSubmit={addOrUpdateOffer} className="space-y-3">
                                    <input aria-label="Title" required name="title" defaultValue={editingOffer?.title || ''} placeholder={t.offerTitle} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400 shadow-inner"/>
                                    <input aria-label="Description" required name="description" defaultValue={editingOffer?.description || ''} placeholder={t.offerDesc} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400 shadow-inner"/>
                                    <input aria-label="Price" required name="price" defaultValue={editingOffer?.price || ''} placeholder={t.offerPrice} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-400 shadow-inner"/>
                                    <input aria-label="Image URL" name="image" defaultValue={editingOffer?.image || ''} placeholder={t.addImage} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none dir-ltr shadow-inner"/>
                                    <input aria-label="Promo Code" name="promoCode" defaultValue={editingOffer?.promoCode || ''} placeholder={t.associatedPromo} className="w-full p-3 bg-white/60 border border-white/50 rounded-xl text-sm outline-none dir-ltr uppercase shadow-inner"/>
                                    
                                    <div className="flex gap-2 items-center text-sm text-slate-600 bg-white/60 p-2 rounded-xl border border-white/50 shadow-inner">
                                        <Icon name="calendar" size={16} className="ml-2 text-slate-400"/>
                                        <label>{t.offerEndDate}:</label>
                                        <input aria-label="End Date" name="endDate" defaultValue={editingOffer?.endDate || ''} type="datetime-local" className="bg-transparent outline-none flex-1"/>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="submit" className={`flex-1 ${editingOffer ? 'bg-blue-600/90' : 'bg-orange-500/90'} backdrop-blur text-white py-3.5 rounded-xl font-bold flex justify-center gap-2`}>
                                            <Icon name={editingOffer ? "save" : "plus"} size={18}/> {editingOffer ? t.edit : t.addOffer}
                                        </button>
                                        {editingOffer && (
                                            <button type="button" onClick={cancelEdit} className="bg-slate-200/50 backdrop-blur text-slate-700 px-5 rounded-xl font-bold border border-slate-300/50">
                                                {t.cancel}
                                            </button>
                                        )}
                                    </div>
                                </form>
                            </div>
                            
                            <div className="space-y-3">
                                {uiConfig.offers && uiConfig.offers.map(offer => (
                                    <div key={offer.id} className={`ios-glass p-3 rounded-2xl shadow-sm flex gap-3 ${editingOffer?.id === offer.id ? 'border-blue-400 ring-2 ring-blue-100' : ''}`}>

                                            <img src={offer.image} className="w-24 h-24 rounded-xl object-cover bg-white/50"/>
                                        ) : (
                                            <div className="w-24 h-24 rounded-xl bg-orange-100/50 text-orange-500 flex items-center justify-center font-bold text-xs p-1 text-center backdrop-blur">
                                                {offer.price}
                                            </div>
                                        )}
                                        <div className="flex-1 py-1">
                                            <h4 className="font-bold text-sm text-slate-800">{offer.title}</h4>
                                            <p className="text-xs text-slate-500 line-clamp-2 mt-0.5">{offer.description}</p>
                                            <p className="text-orange-500 font-bold text-sm mt-1">{offer.price}</p>

                                            <button aria-label="Edit" onClick={()=>handleEditOffer(offer)} className="text-blue-500 p-2 bg-blue-50/50 rounded-xl hover:bg-blue-100 transition"><Icon name="edit" size={16}/></button>

                fabricCanvas.setActiveObject(circle);
            };

            const handleImageUpload = (e) => {

                const reader = new FileReader();
                reader.onload = (f) => {
                    const data = f.target.result;
                    window.fabric.Image.fromURL(data, (img) => {
                        img.scaleToWidth(150);
                        img.set({ left: 100, top: 100 });
                        fabricCanvas.add(img);
                        fabricCanvas.setActiveObject(img);

                reader.readAsDataURL(file);

                                    <div className="flex gap-2 shrink-0">
                                        <button onClick={bringForward} title={lang === 'ar' ? "للأمام" : "Avancer"} className="flex-1 bg-white/10 text-white py-2.5 rounded-xl hover:bg-white/30 transition flex justify-center backdrop-blur">
                                            <Icon name="arrow-up" size={16}/>
                                        </button>
                                        <button onClick={sendBackwards} title={lang === 'ar' ? "للخلف" : "Reculer"} className="flex-1 bg-white/10 text-white py-2.5 rounded-xl hover:bg-white/30 transition flex justify-center backdrop-blur">
                                            <Icon name="arrow-down" size={16}/>

                                    <button onClick={deleteActiveObject} className="bg-red-500/80 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-red-500 transition text-sm flex justify-center gap-2 backdrop-blur shrink-0 mt-1">

                            <div className="md:mt-auto md:pt-4 shrink-0 border-l md:border-l-0 md:border-t border-white/20 pl-3 md:pl-0">
                                <button onClick={clearCanvas} className="text-red-300 w-full py-2.5 rounded-2xl font-bold hover:text-white hover:bg-red-500/50 transition text-sm flex justify-center gap-2">

                        <div className="flex-1 bg-white/5 border border-white/10 backdrop-blur-sm rounded-3xl shadow-inner flex items-center justify-center overflow-auto pattern-dots p-4">

            );
        };

        function App() {
            const getInitialView = () => window.location.hash.substring(1).split('/')[0] || 'home';
            const [lang, setLang] = useState(() => localStorage.getItem('app_lang') || 'ar');
            const [view, setView] = useState(getInitialView());
            const [cart, setCart] = useState(() => { 
                try { 
                    const storedCart = JSON.parse(localStorage.getItem('artisanCart')) || [];
                    return storedCart.map(item => ({ 
                        ...item, 
                        price: item.price || item.basePrice || 0,
                        totalPrice: item.totalPrice || (item.price * item.qty) || 0
                    }));
                } catch { return []; } 
            });
            const [favorites, setFavorites] = useState(() => {
                try { return JSON.parse(localStorage.getItem('artisanFavs')) || []; } catch { return []; }
            });
            
            const [appliedPromo, setAppliedPromo] = useState(null); 
            const [promoCodeInput, setPromoCodeInput] = useState(''); 
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true); 
            const [db, setDb] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [myOrders, setMyOrders] = useState([]);
            const [toast, setToast] = useState(null);
            const [activeChat, setActiveChat] = useState(null);
            const [productModal, setProductModal] = useState(null);
            const [showQrModal, setShowQrModal] = useState(false);
            const [showDesignStudio, setShowDesignStudio] = useState(false);
            const [uiConfig, setUiConfig] = useState({});
            const [bypassMaintenance, setBypassMaintenance] = useState(false);
            
            const [searchTerm, setSearchTerm] = useState("");
            const [isListening, setIsListening] = useState(false);
            const [activeCategory, setActiveCategory] = useState('all');
            
            const [selectedWilayaZone, setSelectedWilayaZone] = useState(() => {
                const savedW = localStorage.getItem('saved_wilaya');
                if (savedW) {
                    const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === savedW);
                    return w ? w.zone : null;
                }
                return null;
            });

            const [expandedOrderId, setExpandedOrderId] = useState(null);

            const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'l-artisan-imprimeur';
            const t = TRANSLATIONS[lang];
            const ADMIN_EMAIL = 'attouabdelkarim2@gmail.com';
            const isAdmin = user && user.email === ADMIN_EMAIL;
            
            const startVoiceSearch = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return showToast(lang === 'ar' ? "متصفحك لا يدعم البحث الصوتي" : "Recherche vocale non supportée", "error");
                
                const recognition = new SpeechRecognition();
                recognition.lang = lang === 'ar' ? 'ar-DZ' : 'fr-FR';
                
                recognition.onstart = () => setIsListening(true);
                recognition.onresult = (e) => { 
                    setSearchTerm(e.results[0][0].transcript); 
                    setIsListening(false); 
                };
                recognition.onerror = () => { setIsListening(false); };
                recognition.onend = () => setIsListening(false);
                
                recognition.start();
            };

            const calculateTotal = (cart, promo, zone) => {
                const subtotal = cart.reduce((s,i) => s + (i.price*i.qty), 0);
                let discount = 0;
                if (promo) {
                    if (promo.discountType === 'percent') discount = subtotal * (promo.discountValue / 100);
                    else if (promo.discountType === 'fixed') discount = promo.discountValue;
                    discount = Math.min(discount, subtotal);
                }
                const delivery = zone ? (DELIVERY_FEES[zone] || 0) : 0;
                const finalTotal = subtotal - discount + delivery;
                return { subtotal, discount, delivery, finalTotal: Math.max(0, finalTotal) };
            };

            const applyPromoCode = async (code) => {
                if (!db || !appId) return showToast(t.conn, "error");
                if (!code) return showToast(t.promoEnter, 'info');
                
                try {
                    const q = window.firebase.query(
                        window.firebase.collection(db, `artifacts/${appId}/public/data/promoCodes`),
                        window.firebase.where('code', '==', code.trim().toUpperCase()),
                        window.firebase.where('active', '==', true),
                        window.firebase.limit(1)
                    );
                    const snapshot = await window.firebase.getDocs(q);
                    
                    if (snapshot.empty) { 
                        setAppliedPromo(null); 
                        showToast(t.promoInvalid, 'error'); 
                        return; 
                    }
                    
                    const promo = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
                    
                    // حماية وتأمين الكوبون (التحقق من الصلاحية والحدود)
                    if (promo.expiryDate && new Date(promo.expiryDate) < new Date()) {
                        showToast(t.expiredPromo, 'error');
                        setAppliedPromo(null);
                        return;
                    }
                    
                    if (promo.maxUses && promo.currentUses >= promo.maxUses) {
                        showToast(t.limitReachedPromo, 'error');
                        setAppliedPromo(null);
                        return;
                    }

                    const currentTotal = cart.reduce((s,i) => s + (i.price*i.qty), 0);
                    if (promo.minAmount && currentTotal < promo.minAmount) {
                         showToast(`${t.promoMinAmount} ${promo.minAmount} ${t.currency}`, 'error');
                         setAppliedPromo(null);
                         return;
                    }
                    
                    setAppliedPromo(promo);
                    showToast(t.promoApplied, 'success');
                } catch (e) { showToast(t.err, "error"); }
            };
            
            const handleGetOffer = async (offer) => {
                const cartItem = {
                    id: `offer-${offer.id}`,
                    name: { fr: offer.title, ar: offer.title }, 
                    basePrice: parseFloat(offer.price) || 0,
                    price: parseFloat(offer.price) || 0,
                    image: offer.image,
                    qty: 1,
                    selectedVariants: [{ id: 'type', label: 'Type', value: 'Offre Spéciale' }]
                };
                
                setCart(prev => [...prev, { ...cartItem, cartId: `offer-${Date.now()}` }]);
                if (offer.promoCode) await applyPromoCode(offer.promoCode);
                
                navigate('cart');
                showToast(t.addToCart, 'success');
            };

            const toggleFavorite = (product) => {
                let newFavs;
                if (favorites.some(f => f.id === product.id)) {
                    newFavs = favorites.filter(f => f.id !== product.id);
                    showToast(t.removeFromFav);
                } else {
                    newFavs = [...favorites, product];
                    showToast(t.addToFav, 'success');
                }
                setFavorites(newFavs);
                localStorage.setItem('artisanFavs', JSON.stringify(newFavs));
            };

            const navigate = (newView, replace = false) => {
                if (newView === view && !activeChat && !productModal && !showQrModal && !showDesignStudio) return;
                setView(newView);
                setAppliedPromo(null); 
                setActiveChat(null); 
                setProductModal(null);
                setShowQrModal(false);
                setShowDesignStudio(false);
                const hash = newView;
                if (replace) window.history.replaceState({ view: newView, chat: false }, '', `#${hash}`);
                else window.history.pushState({ view: newView, chat: false }, '', `#${hash}`);
            };

            const openChat = (chatDetails) => {
                setActiveChat(chatDetails);
                window.history.pushState({ view: view, chat: true, userId: chatDetails?.userId, userName: chatDetails?.userName }, '', `#chat`);
            };

            const closeChat = () => window.history.back();
            const openProductModal = (product) => setProductModal(product);
            const closeProductModal = () => setProductModal(null);

            useEffect(() => { document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = lang; localStorage.setItem('app_lang', lang); }, [lang]);
            const toggleLang = () => setLang(prev => prev === 'ar' ? 'fr' : 'ar');
            
            useEffect(() => { 
                localStorage.setItem('artisanCart', JSON.stringify(cart.map(i => ({
                    id: i.id, 
                    name: i.name, 
                    basePrice: i.basePrice, 
                    price: i.price,
                    qty: i.qty, 
                    image: i.image, 
                    selectedVariants: i.selectedVariants || [] 
                }))));
            }, [cart]);

            useEffect(() => {
                const handlePopState = (event) => {
                    const state = event.state;
                    if (state && state.view) {
                        setView(state.view);
                        setActiveChat(state.chat ? { userId: state.userId, userName: state.userName } : null);
                    } else {
                        setView(getInitialView());
                        setActiveChat(null);
                    }
                };
                window.addEventListener('popstate', handlePopState);
                if (window.history.state === null) {
                    const initialViewName = getInitialView();
                    window.history.replaceState({ view: initialViewName, chat: false }, '', `#${initialViewName}`);
                }
                return () => window.removeEventListener('popstate', handlePopState);
            }, [view]);

            useEffect(() => {
                const init = async () => {
                    if(!window.__firebase_config) return;
                    
                    const checkFirebase = setInterval(async () => {
                        if (window.firebase && window.isFirebaseReady) {
                            clearInterval(checkFirebase); 
                            try {
                                const app = window.firebase.initializeApp(JSON.parse(window.__firebase_config));
                                const auth = window.firebase.getAuth(app);
                                const firestore = window.firebase.getFirestore(app);
                                setDb(firestore);
                                
                                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                                    await window.firebase.signInWithCustomToken(auth, window.__initial_auth_token);
                                }
                                
                                window.firebase.onAuthStateChanged(auth, (u) => { 
                                    setUser(u); 
                                    setAuthLoading(false); 
                                });
                            } catch (e) { 
                                console.error("Firebase Init Error", e); 
                                setAuthLoading(false); 
                            }
                        }
                    }, 100); 
                };
                init();
            }, []);

            useEffect(() => {
                if (!user || !db || !appId) return;
                
                // تنبيهات المتصفح الأصلية (Native Notifications)
                if ("Notification" in window && Notification.permission !== "granted") {
                    Notification.requestPermission();
                }

                const notifRef = window.firebase.collection(db, `artifacts/${appId}/users/${user.uid}/notifications`);
                const unsubNotif = window.firebase.onSnapshot(window.firebase.query(notifRef, window.firebase.orderBy('date', 'desc')), (snap) => {
                    const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    setNotifications(list);
                    const fresh = list.find(n => !n.read && n.date && n.date.toMillis && (Date.now() - n.date.toMillis()) < 5000);
                    if (fresh) {
                        const msgText = typeof fresh.message === 'object' ? (fresh.message[lang] || fresh.message.fr) : fresh.message;
                        showToast(msgText, 'success');
                        
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification(t.appTitle, { body: msgText });
                        }
                    }
                });
                const ordersRef = window.firebase.collection(db, `artifacts/${appId}/public/data/orders`);
                const unsubOrders = window.firebase.onSnapshot(window.firebase.query(ordersRef, window.firebase.where('customerUserId', '==', user.uid)), (snap) => {
                    const fetchedOrders = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    fetchedOrders.sort((a, b) => {
                        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
                        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
                        return timeB - timeA;
                    });
                    setMyOrders(fetchedOrders);
                });
                const unsubConfig = window.firebase.onSnapshot(window.firebase.doc(db, `artifacts/${appId}/config/ui`), (d) => { if(d.exists()) setUiConfig(d.data()); });
                return () => { unsubNotif(); unsubOrders(); unsubConfig(); };
            }, [user, db, lang, appId]);

            const showToast = (msg, type='info') => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };
            
            const addToCart = (p) => { 
                setCart(prev => {
                    const cartItemId = `${p.id}-${Date.now()}`; 
                    const newItem = { ...p, cartId: cartItemId, price: p.price, qty: p.qty, selectedVariants: p.selectedVariants || [] };
                    return [...prev, newItem];
                }); 
                showToast(t.addToCart); 
            };

            const updateQty = (cartId, delta) => {
                setCart(prev => prev.map(item => {
                    if(item.cartId === cartId) { const newQty = Math.max(0, item.qty + delta); return {...item, qty: newQty}; }
                    return item;

                let currentZone = selectedWilayaZone;
                if (selectedWilayaString) {
                    const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === selectedWilayaString);
                    if (w) currentZone = w.zone;

                const customOrderId = Math.random().toString(36).substring(2, 11).toUpperCase();
                
                try {
                    const orderData = {
                        id: customOrderId,
                        customerUserId: user.uid,
                        customerName: name,
                        phone: phone,
                        wilaya: selectedWilayaString || '',
                        orderDetails: formData.get('orderDetails') || '',
                        items: cart.map(i => ({

                            name: i.name || '', 
                            basePrice: i.basePrice || 0, 
                            price: i.price || 0, 
                            qty: i.qty || 1, 
                            image: i.image || '', 
                            selectedVariants: i.selectedVariants || [] 
                        })),
                        subtotal: subtotal || 0,
                        total: finalTotal || 0,
                        discount: discount || 0,
                        deliveryFee: delivery || 0,
                        promoCode: appliedPromo ? { 
                            code: appliedPromo.code || '', 
                            value: discount || 0, 
                            type: appliedPromo.discountType || '' 
                        } : null,
                        status: 'En attente',
                        createdAt: window.firebase.Timestamp.now()
                    };

                    localStorage.setItem('saved_phone', phone);
                    localStorage.setItem('saved_wilaya', selectedWilayaString || '');

                    await window.firebase.setDoc(window.firebase.doc(db, documentPath), orderData);

                    if (appliedPromo && appliedPromo.id && window.firebase.increment) {
                        const promoRef = window.firebase.doc(db, `artifacts/${appId}/public/data/promoCodes/${appliedPromo.id}`);
                        await window.firebase.updateDoc(promoRef, { currentUses: window.firebase.increment(1) });
                    }
                    
                    let msg = { fr: "Commande reçue!", ar: "تم استلام الطلب!" };
                    await window.firebase.addDoc(window.firebase.collection(db, `artifacts/${appId}/users/${user.uid}/notifications`), { 
                        message: msg, 
                        date: window.firebase.Timestamp.now(), 
                        read: false, 
                        type: 'info' 
                    });
                    
                    setCart([]); 
                    setAppliedPromo(null); 
                    setPromoCodeInput(''); 
                    navigate('orders'); 
                    showToast(t.orderSent, "success");

                                </div>
                                {cart.length === 0 ? <div className="text-center py-20 text-slate-400 ios-glass rounded-3xl"><Icon name="shopping-bag" size={48} className="mx-auto mb-4 opacity-40"/>{t.emptyCart}</div> : (
                                    <div className="space-y-4">
                                        {cart.map((i) => (
                                            <div key={i.cartId} className="ios-glass p-3 rounded-3xl shadow-sm flex gap-3 items-center hover:border-blue-300 transition group">
                                                <div className="w-20 h-20 rounded-2xl overflow-hidden border border-white/50 shrink-0">
                                                    <ImageWithSkeleton src={i.image} className="w-full h-full object-cover bg-white/40"/>
                                                </div>
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-sm text-slate-800 mb-0.5">{i.name[lang]}</h4>
                                                    <div className="text-[11px] text-slate-500 mb-2 leading-tight">
                                                        {i.selectedVariants && i.selectedVariants.length > 0 && <span className="font-bold text-blue-600 block mb-0.5">(مخصص)</span>}
                                                        {i.selectedVariants && i.selectedVariants.map(v => <span key={v.id} className="block truncate">{v.label}: {v.value}</span>)}
                                                    </div>
                                                    <div className="flex items-center gap-3 bg-white/50 w-max rounded-full p-1 border border-white/60">
                                                        <button aria-label="Decrease Quantity" onClick={()=>updateQty(i.cartId, -1)} className="w-6 h-6 rounded-full bg-white shadow-sm flex items-center justify-center hover:text-blue-600 transition font-bold">-</button>
                                                        <span className="text-xs font-bold w-4 text-center">{i.qty}</span>
                                                        <button aria-label="Increase Quantity" onClick={()=>updateQty(i.cartId, 1)} className="w-6 h-6 rounded-full bg-white shadow-sm flex items-center justify-center hover:text-blue-600 transition font-bold">+</button>
                                                    </div>
                                                </div>
                                                <div className="text-right flex flex-col justify-between h-full py-1">
                                                    <button aria-label="Remove Item" onClick={()=>updateQty(i.cartId, -100)} className="text-slate-300 hover:text-red-500 p-1.5 rounded-full transition self-end bg-white/50 border border-white/60"><Icon name="x" size={14}/></button>
                                                    <div className="font-black text-blue-700 text-sm mt-auto bg-white/50 px-2 py-1 rounded-lg border border-white/60">{i.price * i.qty} {t.currency}</div>
                                                </div>
                                            </div>
                                        ))}
                                        
                                        {(() => {
                                            const { subtotal, discount, finalTotal, delivery } = calculateTotal(cart, appliedPromo, selectedWilayaZone); 
                                            const savedPhone = localStorage.getItem('saved_phone') || '';
                                            const savedWilaya = localStorage.getItem('saved_wilaya') || '';

                                            return (
                                                <div className="ios-glass p-5 rounded-[2rem] shadow-lg mt-6">
                                                    <div className="space-y-3 pb-4 border-b border-white/40 mb-4">
                                                        <h4 className="font-bold text-slate-700 text-sm flex items-center gap-2"><Icon name="tag" size={16}/> {t.promoPh}</h4>
                                                        {appliedPromo ? (
                                                            <div className="bg-green-50/80 backdrop-blur border border-green-200 text-green-700 font-bold p-3.5 rounded-2xl flex justify-between items-center text-sm shadow-inner">
                                                                <span>{appliedPromo.code} <span className="text-xs opacity-70 ml-1">(-{discount} {t.currency})</span></span>
                                                                <button aria-label="Remove Promo" onClick={() => { setAppliedPromo(null); setPromoCodeInput(''); }} className="text-red-500 hover:text-red-700 p-1.5 bg-white/80 rounded-full"><Icon name="x" size={14} /></button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex gap-2">
                                                                <input aria-label="Promo Code" type="text" value={promoCodeInput} onChange={e => setPromoCodeInput(e.target.value)} placeholder={t.promoPh} className="flex-1 p-3.5 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 dir-ltr uppercase transition shadow-inner" />
                                                                <button onClick={() => applyPromoCode(promoCodeInput)} disabled={!promoCodeInput.trim()} className="bg-slate-900/90 backdrop-blur hover:bg-slate-800 text-white px-5 py-3.5 rounded-2xl font-bold text-sm transition disabled:opacity-50 shadow-md">{t.promoApply}</button>
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="space-y-2.5 text-sm mb-3 text-slate-600 font-medium">
                                                        <div className="flex justify-between"><span>{t.subtotal}</span><span>{subtotal} {t.currency}</span></div>
                                                        {delivery > 0 && <div className="flex justify-between text-slate-800 font-bold bg-white/40 p-1.5 rounded-lg -mx-1.5 px-1.5"><span>{t.deliveryFee}</span><span>+ {delivery} {t.currency}</span></div>}
                                                        {discount > 0 && <div className="flex justify-between text-green-600 font-bold bg-green-50/50 p-1.5 rounded-lg -mx-1.5 px-1.5"><span>{t.discount}</span><span>- {discount} {t.currency}</span></div>}
                                                    </div>
                                                    <div className="flex justify-between items-center font-bold border-t border-white/50 pt-4 mb-6">
                                                        <span className="text-lg text-slate-800">{t.total}</span>
                                                        <span className="text-2xl text-blue-700 font-black bg-white/60 px-4 py-1.5 rounded-xl border border-white/50">{finalTotal} <span className="text-base">{t.currency}</span></span>
                                                    </div>
                                                    
                                                    <form onSubmit={submitOrder} className="space-y-3 relative z-10">
                                                        <input aria-label="Name" required name="name" defaultValue={user.displayName || ''} placeholder={t.namePh} className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition shadow-inner"/>
                                                        <input aria-label="Phone" required name="phone" type="tel" minLength="8" defaultValue={savedPhone} placeholder={t.phonePh} className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition dir-ltr shadow-inner"/>
                                                        <div className="relative">
                                                            <select aria-label="Wilaya" name="wilaya" required defaultValue={savedWilaya} onChange={(e) => {
                                                                const w = WILAYAS.find(wil => `${wil.id} - ${wil.name}` === e.target.value);
                                                                setSelectedWilayaZone(w ? w.zone : null);
                                                            }} className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition appearance-none text-slate-800 shadow-inner">
                                                                <option value="">{t.selectWilaya}</option>
                                                                {WILAYAS.map((w) => <option key={w.id} value={`${w.id} - ${w.name}`} className="text-black">{w.id} - {w.name}</option>)}
                                                            </select>
                                                            <Icon name="chevron-down" className="absolute left-4 top-4 text-slate-400 pointer-events-none" size={20}/>
                                                        </div>
                                                        <textarea aria-label="Order Details" required name="orderDetails" placeholder={t.orderDetails} rows="3" className="w-full p-4 bg-white/60 border border-white/50 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-400 transition shadow-inner resize-none"></textarea>
                                                        <button type="submit" className="w-full bg-green-600/90 backdrop-blur hover:bg-green-500 text-white py-4 rounded-2xl font-black shadow-lg shadow-green-600/30 transition flex justify-center items-center gap-2 active:scale-95 text-base mt-2" disabled={cart.length === 0}><Icon name="check-circle" size={20}/> {t.confirm}</button>
                                                    </form>
                                                </div>
                                            );
                                        })()}
                                    </div>
                                )}
                            </div>
                        )}
                        {view === 'orders' && (
                            <div className="animate-fadeIn space-y-4 max-w-md mx-auto pb-10">
                                <h2 className="font-bold text-2xl mb-4 text-slate-800">{t.myOrders}</h2>
                                {myOrders.length === 0 ? <div className="text-center py-20 text-slate-400 ios-glass rounded-3xl"><Icon name="list" size={48} className="mx-auto mb-4 opacity-40"/>{t.noOrders}</div> : myOrders.map(o => {
                                    const statusObj = STATUS_OPTIONS.find(s => s.key === o.status) || STATUS_OPTIONS[0];
                                    const isExpanded = expandedOrderId === o.id;
                                    const currentStatusIndex = STATUS_OPTIONS.findIndex(s => s.key === o.status);
                                    
                                    const orderDate = o.createdAt?.toDate ? o.createdAt.toDate() : new Date();
                                    const estDelivery = new Date(orderDate);
                                    estDelivery.setDate(estDelivery.getDate() + 3);
                                    
                                    return (
                                        <div key={o.id} className="ios-glass rounded-3xl shadow-sm overflow-hidden hover:shadow-md transition">
                                            <div className="p-4 border-b border-white/40 flex justify-between items-center bg-white/30 backdrop-blur-sm">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-lg text-slate-800 bg-white/50 px-2 rounded-lg border border-white/60">#{o.id.slice(-6)}</span>
                                                        <button onClick={() => { navigator.clipboard.writeText(o.id); showToast(lang === 'ar' ? 'تم نسخ رقم الطلب' : 'Numéro copié', 'success'); }} className="text-slate-400 hover:text-blue-600 transition bg-white/50 p-1.5 rounded-md" title="نسخ المعرف">
                                                            <Icon name="copy" size={14}/>
                                                        </button>
                                                    </div>
                                                    <span className="text-[11px] font-mono text-slate-500 block mt-1.5" dir="ltr">
                                                        {o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString(lang === 'ar' ? 'ar-DZ' : 'fr-FR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : 'الآن'}
                                                    </span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-black text-blue-700 text-lg mb-1">{o.total} {t.currency}</div>
                                                    <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold border backdrop-blur-md ${STATUS_COLORS[o.status].replace('bg-', 'bg-').replace('100', '100/80')}`}>{statusObj.label[lang]}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="px-6 py-5">
                                                <div className="relative border-l-2 border-white/50 space-y-6 ml-2">
                                                    {STATUS_OPTIONS.map((step, idx) => {
                                                        const isCompleted = idx <= currentStatusIndex;
                                                        const isCurrent = idx === currentStatusIndex;
                                                        return (
                                                            <div key={step.key} className="relative pl-5">
                                                                <div className={`absolute -left-[10px] top-1 w-4 h-4 rounded-full border-2 transition-all ${isCompleted ? 'bg-blue-600 border-blue-600 shadow-sm' : 'bg-white/60 border-slate-300'}`}>
                                                                    {isCompleted && <Icon name="check" size={10} className="text-white absolute top-[1px] left-[1px]"/>}
                                                                </div>
                                                                <p className={`text-xs font-bold transition-all ${isCurrent ? 'text-blue-700 scale-105' : isCompleted ? 'text-slate-700' : 'text-slate-400'}`}>
                                                                    {step.label[lang]}
                                                                </p>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                {o.status !== 'Prêt' && (
                                                    <div className="mt-5 pt-3 border-t border-white/40 text-[11px] font-bold text-slate-500 flex items-center gap-1.5 bg-white/40 p-2 rounded-xl border border-white/30">
                                                        <Icon name="truck" size={14} className="text-blue-500" />
                                                        {t.estimatedDelivery} <span className="text-slate-800 bg-white/60 px-2 py-0.5 rounded-md">{estDelivery.toLocaleDateString()}</span>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="px-4 pb-4 flex justify-between items-center pt-3 border-t border-white/40">
                                                <button aria-label="Toggle Details" onClick={() => setExpandedOrderId(isExpanded ? null : o.id)} className="text-xs text-slate-600 font-bold flex items-center gap-1 hover:text-slate-900 transition bg-white/50 px-3 py-1.5 rounded-xl border border-white/60">
                                                    {isExpanded ? <Icon name="chevron-up" size={14}/> : <Icon name="chevron-down" size={14}/>} {isExpanded ? 'Masquer' : t.showDetails}
                                                </button>
                                                <div className="flex gap-2 flex-wrap justify-end">
                                                    <a href={`https://wa.me/213549179000?text=${encodeURIComponent(lang === 'ar' ? `مرحباً، أستفسر عن طلبي رقم #${o.id}` : `Bonjour, je me renseigne sur ma commande #${o.id}`)}`} target="_blank" className="text-xs bg-green-500/90 text-white px-3 py-1.5 rounded-xl font-bold hover:bg-green-500 transition flex items-center gap-1 shadow-sm backdrop-blur-sm">
                                                        <Icon name="message-circle" size={14}/> {t.whatsapp}
                                                    </a>
                                                    {o.status === 'En attente' && (
                                                        <button onClick={() => cancelOrder(o.id)} className="text-xs bg-red-50/80 text-red-600 px-3 py-1.5 rounded-xl font-bold hover:bg-red-100 transition flex items-center gap-1 border border-red-100 backdrop-blur-sm">
                                                            <Icon name="x-circle" size={14}/> {t.cancelOrder}
                                                        </button>
                                                    )}
                                                    <button onClick={() => handleReorder(o)} className="text-xs bg-white/80 text-blue-600 px-3 py-1.5 rounded-xl font-bold hover:bg-white transition flex items-center gap-1 border border-white/60 shadow-sm backdrop-blur-sm">
                                                        <Icon name="rotate-ccw" size={14}/> {t.reOrder}
                                                    </button>
                                                </div>
                                            </div>

                                            {isExpanded && (
                                                <div className="bg-white/40 p-4 border-t border-white/50 text-xs animate-slideUp shadow-inner">
                                                    <p className="font-bold text-slate-800 mb-2">{t.details}:</p>
                                                    <ul className="space-y-2 mb-3">
                                                        {o.items.map((item, idx) => (
                                                            <li key={idx} className="flex justify-between border-b border-white/50 pb-1.5 last:border-0">
                                                                <span className="font-medium">{item.qty}x {item.name[lang] || item.name}</span>
                                                                <span className="font-mono font-bold text-slate-700">{item.price * item.qty} {t.currency}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                    {o.deliveryFee > 0 && <div className="flex justify-between text-slate-600 pt-2 border-t border-white/50 font-medium"><span>{t.deliveryFee}</span><span>{o.deliveryFee} {t.currency}</span></div>}
                                                    <p className="mt-3 text-slate-600 italic bg-white/60 p-2.5 rounded-xl border border-white/50">{o.orderDetails || "No additional notes."}</p>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        {view === 'notifications' && (
                            <div className="animate-fadeIn max-w-md mx-auto pb-10"><h2 className="font-bold text-2xl mb-4 text-slate-800">{t.notifications}</h2>{notifications.length === 0 ? <p className="text-center text-slate-400 py-20 ios-glass rounded-3xl"><Icon name="bell-off" size={48} className="mx-auto mb-4 opacity-40"/>{t.noNotifs}</p> : (<div className="space-y-3">{notifications.map(n => (<div key={n.id} onClick={()=>markRead(n.id)} className={`p-4 rounded-2xl border cursor-pointer transition backdrop-blur-md shadow-sm ${n.read ? 'bg-white/60 border-white/50' : 'bg-blue-50/80 border-blue-200 shadow-blue-500/10'}`}><div className="flex gap-3"><div className={`mt-1.5 w-2 h-2 rounded-full shrink-0 ${n.read ? 'bg-slate-300' : 'bg-blue-500 animate-pulse'}`}></div><div><p className={`text-sm ${!n.read ? 'font-bold text-slate-900' : 'text-slate-600'}`}>{typeof n.message === 'object' ? n.message[lang] : n.message}</p><span className="text-[10px] text-slate-400 mt-1.5 block dir-ltr text-right bg-white/50 w-max px-2 py-0.5 rounded-md font-mono">{n.date?.toDate ? n.date.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '—'}</span></div></div></div>))}</div>)}</div>
                        )}
                        {view === 'profile' && <ProfileScreen user={user} t={t} navigate={navigate} showToast={showToast} setView={setView} ADMIN_EMAIL={ADMIN_EMAIL} setUser={setUser} totalSpent={myOrders.filter(o => o.status === 'Prêt').reduce((sum, o) => sum + o.total, 0)} />}
                        {view === 'admin' && <AdminDashboard db={db} appId={appId} updateOrderStatus={updateOrderStatus} lang={lang} t={t} onOpenChat={openChat} showToast={showToast} user={user} ADMIN_EMAIL={ADMIN_EMAIL} />}
                    </main>

                    {productModal && <ProductModal product={productModal} lang={lang} t={t} onAdd={addToCart} onClose={closeProductModal} />}
                    {showQrModal && <QrGeneratorModal t={t} lang={lang} onClose={()=>setShowQrModal(false)} />}
                    {showDesignStudio && <DesignStudio t={t} lang={lang} onClose={()=>setShowDesignStudio(false)} onAddToCart={(p) => { addToCart(p); navigate('cart'); }} />}

                    {/* Floating Bottom Navigation (iOS 26 Style Dock) */}
                    <div className="fixed bottom-4 left-4 right-4 max-w-md mx-auto ios-glass rounded-3xl flex justify-between px-2 py-3 z-50 shadow-[0_8px_32px_rgba(0,0,0,0.1)] safe-bottom border-t border-white/80">
                        <button aria-label="Home" onClick={()=>navigate('home')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='home'?'active text-blue-600':'text-slate-400'}`}><Icon name="home" size={22}/><span className="text-[10px] font-bold">{t.home}</span></button>
                        <button aria-label="Orders" onClick={()=>navigate('orders')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='orders'?'active text-blue-600':'text-slate-400'}`}><Icon name="list-checks" size={22}/><span className="text-[10px] font-bold">{t.orders}</span></button>
                        <button aria-label="Cart" onClick={()=>navigate('cart')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='cart'?'active text-blue-600':'text-slate-400'}`}><div className="relative"><Icon name="shopping-cart" size={22}/>{cart.length > 0 && <span className="absolute -top-1 -right-1 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white shadow-sm"></span>}</div><span className="text-[10px] font-bold">{t.cart}</span></button>
                        <button aria-label="Profile" onClick={()=>navigate('profile')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='profile'?'active text-blue-600':'text-slate-400'}`}><Icon name="user" size={22}/><span className="text-[10px] font-bold">{t.profile}</span></button>
                        {isAdmin && <button aria-label="Admin Panel" onClick={()=>navigate('admin')} className={`flex flex-col items-center gap-1.5 nav-btn ${view==='admin'?'active text-blue-600':'text-slate-400'}`}><Icon name="shield" size={22}/><span className="text-[10px] font-bold">{t.admin}</span></button>}
                    </div>

                    {!isAdmin && !activeChat && view !== 'admin' && (
                        <div className="fixed bottom-[6.5rem] right-4 flex flex-col gap-3 z-40 max-w-md mx-auto w-full items-end pr-4 pointer-events-none">
                            <a aria-label="WhatsApp" href="https://wa.me/213549179000" target="_blank" className="pointer-events-auto bg-green-500/90 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-lg hover:scale-110 transition-transform flex items-center justify-center border border-white/20"><Icon name="phone" size={24} fill="white" className="text-white"/></a>
                            <button aria-label="Chat with us" onClick={() => openChat({ userId: user.uid, userName: user.displayName })} className="pointer-events-auto bg-gradient-to-r from-blue-600/90 to-indigo-600/90 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-xl shadow-blue-600/30 animate-slideUp hover:scale-110 transition-transform flex items-center gap-2 group border border-white/20"><Icon name="message-circle" size={24} /></button>
                        </div>
                    )}
                    {activeChat && <ChatScreen user={user} db={db} appId={appId} targetUserId={isAdmin ? activeChat.userId : null} targetUserName={isAdmin ? activeChat.userName : null} lang={lang} t={t} onBack={closeChat} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
    </html>
